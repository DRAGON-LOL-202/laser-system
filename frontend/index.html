<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ====================================================================
   إعدادات الاتصال بالسيرفر
   API_BASE يأتي من ملف config.js (يوضع بجانب هذا الملف على الاستضافة)
==================================================================== */
const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || "http://localhost:5000";

/* ====================================================================
   طبقة الاتصال بالـ API
==================================================================== */
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

const Api = {
  token: safeGet("laser_token") || null,
  setToken(t){ this.token=t; if(t) safeSet("laser_token",t); else safeRemove("laser_token"); },
  getToken(){ return this.token; },

  async request(path, {method="GET", body=null, isForm=false, raw=false}={}){
    const headers = {};
    if(this.token) headers["Authorization"] = "Bearer "+this.token;
    if(!isForm) headers["Content-Type"]="application/json";

    const opts = { method, headers };
    if(body!==null) opts.body = isForm ? body : JSON.stringify(body);

    let res;
    try{
      res = await fetch(API_BASE+path, opts);
    }catch(netErr){
      throw new Error("تعذّر الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت أو أن السيرفر يعمل.");
    }

    if(raw) return res;

    let data=null;
    try{ data = await res.json(); }catch(e){ /* قد لا يوجد body */ }

    if(!res.ok){
      const msg = (data && data.error) ? data.error : ("خطأ غير متوقع ("+res.status+")");
      throw new Error(msg);
    }
    return data;
  },

  login(username,password){ return this.request("/api/auth/login",{method:"POST",body:{username,password}}); },
  me(){ return this.request("/api/auth/me"); },
  logout(){ return this.request("/api/auth/logout",{method:"POST"}).catch(()=>{}); },

  getUsers(){ return this.request("/api/users"); },
  addUser(payload){ return this.request("/api/users",{method:"POST",body:payload}); },
  deleteUser(id){ return this.request("/api/users/"+id,{method:"DELETE"}); },

  getMachines(){ return this.request("/api/machines"); },
  toggleMachine(code){ return this.request("/api/machines/"+code+"/toggle",{method:"PATCH"}); },
  addFileByName(code,name,time){ return this.request("/api/machines/"+code+"/files",{method:"POST",body:{name,time}}); },
  uploadFile(code,file,time){
    const fd = new FormData();
    fd.append("file",file);
    fd.append("time",time);
    return this.request("/api/machines/"+code+"/files/upload",{method:"POST",body:fd,isForm:true});
  },
  renameFile(fileId,name,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/name",{method:"PATCH",body:{name,machineCode,machineLabel}}); },
  setFileTime(fileId,time,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/time",{method:"PATCH",body:{time,machineCode,machineLabel}}); },
  setFileStatus(fileId,status,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/status",{method:"PATCH",body:{status,machineCode,machineLabel}}); },
  deleteFile(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId,{method:"DELETE",body:{machineCode,machineLabel}}); },
  reorderFiles(code,orderedIds){ return this.request("/api/machines/"+code+"/files/reorder",{method:"PATCH",body:{orderedIds}}); },
 downloadFileUrl(fileId){ return API_BASE+"/api/machines/files/"+fileId+"/download?token="+encodeURIComponent(this.token||""); },
  uploadThumbnail(fileId,file,machineCode,machineLabel){
    const fd=new FormData();
    fd.append("thumbnail",file);
    fd.append("machineCode",machineCode);
    fd.append("machineLabel",machineLabel);
    return this.request("/api/machines/files/"+fileId+"/thumbnail",{method:"POST",body:fd,isForm:true});
  },
  deleteThumbnail(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/thumbnail",{method:"DELETE",body:{machineCode,machineLabel}}); },
  thumbnailUrl(fileId){ return API_BASE+"/api/machines/files/"+fileId+"/thumbnail?token="+encodeURIComponent(this.token||""); },

  getLogs(){ return this.request("/api/logs"); },
  getNotifications(){ return this.request("/api/notifications"); },
  markAllRead(){ return this.request("/api/notifications/read-all",{method:"PATCH"}); },
};

function t2s(t){if(!t)return 0;const[h,m,s]=t.split(":").map(Number);return(h||0)*3600+(m||0)*60+(s||0);}
function s2t(s){s=Math.max(0,s);return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");}

function fmtLogTime(iso){
  try{ return new Date(iso).toLocaleTimeString("ar-EG",{hour12:false}); }
  catch(e){ return iso||""; }
}

    trash:<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,
    pen:<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
    play:<><polygon points="5 3 19 12 5 21 5 3"/></>,
    pause:<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>,
    dots:<><circle cx="9" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.2" fill="currentColor" stroke="none"/></>,
    rep:<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></>,
    ok:<><polyline points="20 6 9 17 4 12"/></>,
    x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    plus:<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    warn:<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    info:<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
    laser:<><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></>,

    zoomIn:<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></>,

function Spinner({s=16,color="#f97316"}){
  return <div className="spin" style={{display:"inline-flex",color}}><I n="spinner" s={s}/></div>;
}

function MIco({sz=50}){
  return(
    <svg width={sz} height={sz*0.75} viewBox="0 0 80 60" fill="none" strokeLinecap="round">
      <rect x="5" y="20" width="70" height="30" rx="3" stroke="#f97316" strokeWidth="1.5"/>
      <rect x="15" y="25" width="50" height="20" rx="2" stroke="#f97316" strokeWidth="1"/>
      <line x1="10" y1="15" x2="70" y2="15" stroke="#f97316" strokeWidth="1.5"/>
      <rect x="20" y="10" width="40" height="8" rx="2" stroke="#f97316" strokeWidth="1"/>
      <circle cx="25" cy="14" r="2" fill="#f97316"/>
      <circle cx="55" cy="14" r="2" fill="#f97316"/>
      <line x1="35" y1="30" x2="45" y2="30" stroke="#f97316" strokeWidth="1"/>
      <line x1="40" y1="28" x2="40" y2="40" stroke="#f97316" strokeWidth="0.8" strokeDasharray="2,1"/>
      <rect x="25" y="50" width="12" height="5" rx="1" stroke="#f97316"/>
      <rect x="43" y="50" width="12" height="5" rx="1" stroke="#f97316"/>
    </svg>
  );
}

function Badge({s}){
  const c={
    CUTTING:  {l:"تم القص",    bg:"#0f4c2a",cl:"#4ade80",b:"#166534"},
    WORKING:  {l:"جاري العمل", bg:"#1e3a5f",cl:"#60a5fa",b:"#1e40af"},
    WAITING:  {l:"في الانتظار",bg:"#1e2d4a",cl:"#94a3b8",b:"#334155"},
    DELIVERED:{l:"تم التسليم", bg:"#0f4c2a",cl:"#4ade80",b:"#166534"},
    STOPPED:  {l:"متوقفة",     bg:"#3f1515",cl:"#fca5a5",b:"#7f1d1d"},
    RUNNING:  {l:"قيد التشغيل",bg:"#0f4c2a",cl:"#4ade80",b:"#166534"},
  }[s]||{l:s,bg:"#1e2d4a",cl:"#94a3b8",b:"#334155"};
  return <span style={{background:c.bg,color:c.cl,border:"1px solid "+c.b,borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{c.l}</span>;
}

function ErrBanner({msg}){
  if(!msg) return null;
  return (
    <div style={{background:"#3f1515",border:"1px solid #ef4444",borderRadius:8,padding:"9px 12px",marginBottom:14,fontSize:12,color:"#fca5a5",display:"flex",gap:6,alignItems:"center"}}>
      <I n="warn" s={13}/>{msg}
    </div>
  );
}

/* ---- نقطة حالة الاتصال (Online/Offline) ---- */
function OnlineDot({online}){
  // online === null يعني: حالة الاتصال غير متاحة لهذا العارض (تصفية هرمية) — لا نعرض شيئاً
  if(online===null||online===undefined) return null;
  return (
    <span title={online?"نشط الآن":"غير متصل"} style={{display:"inline-flex",alignItems:"center",gap:5}}>
      <span style={{width:8,height:8,borderRadius:"50%",background:online?"#22c55e":"#475569",boxShadow:online?"0 0 6px #22c55e":"none",flexShrink:0}}/>
      <span style={{fontSize:10,color:online?"#4ade80":"#64748b"}}>{online?"نشط الآن":"غير متصل"}</span>
    </span>
  );
}

/* ---- نافذة معاينة الصورة بالحجم الكامل (Lightbox) ---- */
function Lightbox({src,onClose}){
  if(!src) return null;
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:24,cursor:"zoom-out"}}>
      <button onClick={onClose} style={{position:"absolute",top:18,left:18,background:"#1e2d4a",color:"#e2e8f0",border:"none",borderRadius:8,padding:8,cursor:"pointer"}}>
        <I n="x" s={20}/>
      </button>
      <img src={src} onClick={e=>e.stopPropagation()} style={{maxWidth:"100%",maxHeight:"100%",borderRadius:10,boxShadow:"0 20px 60px rgba(0,0,0,0.6)",cursor:"default"}}/>
    </div>
  );
}

/* ---- خلية صورة المعاينة الصغيرة داخل الجدول (تُفتح بالضغط) ---- */
function ThumbCell({file,onOpen}){
  if(!file.hasThumbnail){
    return <div style={{width:36,height:36,borderRadius:6,background:"#0a0e1a",border:"1px dashed #334155",display:"flex",alignItems:"center",justifyContent:"center",color:"#334155",margin:"0 auto"}}><I n="image" s={14}/></div>;
  }
  return (
    <div onClick={()=>onOpen(Api.thumbnailUrl(file.id))}
      title="اضغط للمعاينة بالحجم الكامل"
      style={{width:36,height:36,borderRadius:6,overflow:"hidden",cursor:"zoom-in",margin:"0 auto",border:"1px solid #1e2d4a",position:"relative"}}>
      <img src={Api.thumbnailUrl(file.id)} alt={file.name} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
    </div>
  );
}

/* ---- LOGIN ---- */
function Login({onLogin}){
  const[u,su]=useState("");const[p,sp]=useState("");const[err,se]=useState("");const[ld,sl]=useState(false);
  const go=async()=>{
    if(!u||!p){se("الرجاء إدخال البيانات");return;}
    se("");sl(true);
    try{
      await onLogin(u,p);
    }catch(e){
      se(e.message||"بيانات الدخول غير صحيحة");
    }finally{
      sl(false);
    }
  };
  return(
    <div style={{display:"flex",minHeight:"100vh",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{width:"100%",maxWidth:380,background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:16,padding:32,boxShadow:"0 20px 60px rgba(0,0,0,0.6)"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{color:"#f97316",display:"flex",justifyContent:"center",marginBottom:12}}><I n="laser" s={44}/></div>
          <h1 style={{color:"#f97316",fontSize:18,fontWeight:700}}>نظام إدارة ماكينات الليزر</h1>
          <p style={{color:"#64748b",fontSize:11,marginTop:5}}>CNC CO2 Laser Management System</p>
        </div>
        {err&&<div style={{background:"#3f1515",border:"1px solid #ef4444",borderRadius:8,padding:"9px 12px",marginBottom:14,fontSize:12,color:"#fca5a5",display:"flex",gap:6,alignItems:"center"}}><I n="warn" s={13}/>{err}</div>}
        {[["اسم المستخدم",u,su,"text"],["كلمة المرور",p,sp,"password"]].map(([l,v,sv,tp])=>(
          <div key={l} style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:12,color:"#94a3b8",marginBottom:5}}>{l}</label>
            <input type={tp} value={v} onChange={e=>sv(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:8,padding:"10px 12px",color:"#e2e8f0",fontSize:14,outline:"none",direction:"ltr",textAlign:"right"}}/>
          </div>
        ))}
        <button onClick={go} disabled={ld}
          style={{width:"100%",background:ld?"#7c3012":"#f97316",color:"#fff",border:"none",borderRadius:8,padding:"12px",fontSize:14,fontWeight:600,cursor:"pointer",marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {ld&&<Spinner s={14} color="#fff"/>}
          {ld?"جاري تسجيل الدخول...":"تسجيل الدخول"}
        </button>
      </div>
    </div>
  );
}

/* ---- MACHINE CARD ---- */
function MCard({m,label}){
  const run=m.status==="RUNNING";
  const currentFile=m.files.length>0?m.files[0].name:(m.currentFile||"—");
  const total=m.totalTime||s2t(m.files.reduce((a,f)=>a+t2s(f.time),0));
  return(
    <div style={{background:"#0d1224",border:"1px solid "+(run?"#166534":"#7f1d1d"),borderRadius:12,padding:16,flex:1}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:6}}>
            <span style={{color:"#f97316",fontWeight:700,fontSize:14}}>{label}</span>
            <Badge s={m.status}/>
          </div>
          <div style={{color:"#64748b",fontSize:10}}>CNC CO2 Laser</div>
        </div>
        <div style={{opacity:0.7,flexShrink:0,marginRight:8}}><MIco sz={44}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div style={{background:"#0a0e1a",borderRadius:8,padding:"8px 10px",border:"1px solid #1e2d4a"}}>
          <div style={{fontSize:10,color:"#64748b",marginBottom:3}}>الملف الحالي</div>
          <div style={{fontSize:12,color:"#e2e8f0",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentFile}</div>
        </div>
        <div style={{background:"#0a0e1a",borderRadius:8,padding:"8px 10px",border:"1px solid #1e2d4a"}}>
          <div style={{fontSize:10,color:"#64748b",marginBottom:3}}>عدد الملفات</div>
          <div style={{fontSize:12,color:"#e2e8f0",fontWeight:600}}>{m.files.length}</div>
        </div>
      </div>
      <div style={{background:"#0a0e1a",borderRadius:8,padding:"8px 10px",border:"1px solid #1e2d4a"}}>
        <div style={{fontSize:10,color:"#64748b",marginBottom:3}}>مجموع وقت الملفات</div>
        <div style={{fontSize:12,color:"#60a5fa",fontWeight:600,fontFamily:"monospace"}}>{total}</div>
      </div>
    </div>
  );
}

/* ---- OPERATOR TABLE ---- */
function OpTable({files,title,onChanged,addToast,machineCode,machineLabel,onOpenImage}){
  const[editTimeId,setETI]=useState(null);const[editTimeVal,setETV]=useState("");
  const[busyId,setBusyId]=useState(null);

  const download=(f)=>{
    if(!f.hasFile){ addToast?addToast("لا يوجد ملف فعلي للتحميل",'error'):alert("لا يوجد ملف فعلي للتحميل"); return; }
    window.open(Api.downloadFileUrl(f.id),"_blank");
  };

  const updSt=async(f,status)=>{
    setBusyId(f.id);
    try{
      await Api.setFileStatus(f.id,status,machineCode,machineLabel);
      await onChanged();
    }catch(e){
      addToast?addToast(e.message||"فشل تعديل الحالة",'error'):alert(e.message);
    }finally{
      setBusyId(null);
    }
  };

  const saveTime=async(f)=>{
    setBusyId(f.id);
    try{
      await Api.setFileTime(f.id,editTimeVal,machineCode,machineLabel);
      await onChanged();
      setETI(null);
    }catch(e){
      addToast?addToast(e.message||"فشل تعديل الوقت",'error'):alert(e.message);
    }finally{
      setBusyId(null);
    }
  };

  return(
    <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:12,overflow:"hidden",flex:1,minWidth:0}}>
      <div style={{padding:"11px 14px",borderBottom:"1px solid #1e2d4a",background:"#0f1830",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontWeight:700,color:"#f97316",fontSize:13}}>{title}</span>
        <span style={{color:"#64748b",fontSize:11}}>{files.length} ملف</span>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:420}}>
          <thead><tr style={{background:"#0a0e1a",borderBottom:"1px solid #1e2d4a"}}>
            {["#","اسم الملف","معاينة","الحالة","الوقت","تحميل"].map((h,i)=>(
              <th key={h} style={{padding:"8px 10px",textAlign:i===1?"right":"center",color:"#64748b",fontWeight:600}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {files.map((f,i)=>(
              <tr key={f.id} className="trh" style={{borderBottom:"1px solid #1a2744"}}>
                <td style={{padding:"9px 10px",textAlign:"center",color:"#475569"}}>{i+1}</td>
                <td style={{padding:"9px 10px",color:"#e2e8f0",maxWidth:140}}>
                  <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
                  <div style={{color:"#475569",fontSize:9}}>{(f.name.split(".").pop()||"").toUpperCase()}</div>
                </td>
                <td style={{padding:"9px 10px",textAlign:"center"}}>
                  <ThumbCell file={f} onOpen={onOpenImage}/>
                </td>
                <td style={{padding:"9px 10px",textAlign:"center"}}>
                  <select value={f.status} disabled={busyId===f.id} onChange={e=>updSt(f,e.target.value)}
                    style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:4,color:"#94a3b8",padding:"4px 4px",fontSize:11,cursor:"pointer",maxWidth:100}}>
                    <option value="WAITING">انتظار</option>
                    <option value="WORKING">جاري</option>
                    <option value="CUTTING">تم القص</option>
                    <option value="DELIVERED">تسليم</option>
                  </select>
                </td>
                <td style={{padding:"9px 10px",textAlign:"center"}}>
                  {editTimeId===f.id?(
                    <div style={{display:"flex",gap:3,justifyContent:"center",alignItems:"center"}}>
                      <button onClick={()=>setETI(null)} disabled={busyId===f.id} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:4,padding:"3px 5px",cursor:"pointer"}}><I n="x" s={11}/></button>
                      <button onClick={()=>saveTime(f)} disabled={busyId===f.id} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"3px 5px",cursor:"pointer"}}><I n="ok" s={11}/></button>
                      <input value={editTimeVal} onChange={e=>setETV(e.target.value)} autoFocus
                        onKeyDown={e=>e.key==="Enter"&&saveTime(f)}
                        style={{width:84,background:"#0a0e1a",border:"1px solid #f97316",borderRadius:4,padding:"4px 6px",color:"#e2e8f0",fontSize:11,outline:"none",fontFamily:"monospace",direction:"ltr",textAlign:"center"}}/>
                    </div>
                  ):(
                    <span onClick={()=>{setETI(f.id);setETV(f.time);}}
                      title="اضغط لتعديل الوقت"
                      style={{color:"#94a3b8",fontFamily:"monospace",fontSize:11,cursor:"pointer",borderBottom:"1px dashed #334155",paddingBottom:1}}>
                      {f.time}
                    </span>
                  )}
                </td>
                <td style={{padding:"9px 10px",textAlign:"center"}}>
                  <button onClick={()=>download(f)}
                    style={{background:"#1e3a5f",color:"#60a5fa",border:"1px solid #1e40af",borderRadius:6,padding:"4px 9px",cursor:"pointer",fontSize:11,display:"inline-flex",alignItems:"center",gap:3}}>
                    <I n="dl" s={11}/> تحميل
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---- ADMIN TABLE ---- */
function AdminTable({machine,title,onChanged,addToast,onOpenImage}){
  const[showAdd,ssa]=useState(false);
  const[fname,sfn]=useState("");const[ftime,sft]=useState("00:08:00");
  const[dragIdx,sdi]=useState(null);
  const[editId,sei]=useState(null);const[editName,sen]=useState("");
  const[editTimeId,setETI]=useState(null);const[editTimeVal,setETV]=useState("");
  const[busy,sBusy]=useState(false);
  const[uploading,sUploading]=useState(false);
  const[thumbUploadingId,setThumbUploadingId]=useState(null);
  const fileRef=useRef();
  const thumbRefs=useRef({});
  const run=machine.status==="RUNNING";

  const wrap=async(fn)=>{
    sBusy(true);
    try{ await fn(); }
    catch(e){ addToast(e.message||"حدث خطأ",'error'); }
    finally{ sBusy(false); }
  };

  const toggle=()=>wrap(async()=>{
    await Api.toggleMachine(machine.code);
    await onChanged();
  });

  const addByName=(name)=>wrap(async()=>{
    await Api.addFileByName(machine.code,name,ftime);
    await onChanged();
    sfn("");ssa(false);
  });

  const handleFileInput=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0) return;
    sUploading(true);
    try{
      for(const f of files){
        await Api.uploadFile(machine.code,f,ftime);
      }
      await onChanged();
      ssa(false);
    }catch(err){
      addToast(err.message||"فشل رفع الملف",'error');
    }finally{
      sUploading(false);
    }
  };

 const uploadThumbFile=async(f,file)=>{
    if(!file) return;
    setThumbUploadingId(f.id);
    try{
      await Api.uploadThumbnail(f.id,file,machine.code,title);
      await onChanged();
    }catch(err){
      addToast(err.message||"فشل رفع صورة المعاينة",'error');
    }finally{
      setThumbUploadingId(null);
    }
  };

  const handleThumbInput=async(f,e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    await uploadThumbFile(f,file);
  };

  const handleThumbPaste=async(f,e)=>{
    const items=e.clipboardData&&e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type&&item.type.startsWith("image/")){
        const file=item.getAsFile();
        if(file){ e.preventDefault(); await uploadThumbFile(f,file); }
        break;
      }
    }
  };

  const del=(f)=>wrap(async()=>{
    if(!confirm(`هل تريد حذف الملف "${f.name}"؟`)) return;
    await Api.deleteFile(f.id,machine.code,title);
    await onChanged();
  });

  const updSt=(f,status)=>wrap(async()=>{
    await Api.setFileStatus(f.id,status,machine.code,title);
    await onChanged();
  });

  const saveEdit=(f)=>wrap(async()=>{
    if(!editName.trim()){ sei(null); return; }
    await Api.renameFile(f.id,editName.trim(),machine.code,title);
    await onChanged();
    sei(null);
  });

  const saveTime=(f)=>wrap(async()=>{
    await Api.setFileTime(f.id,editTimeVal,machine.code,title);
    await onChanged();
    setETI(null);
  });

  const download=(f)=>{
    if(!f.hasFile){ addToast("لا يوجد ملف فعلي للتحميل",'error'); return; }
    window.open(Api.downloadFileUrl(f.id),"_blank");
  };

  const onDS=(i)=>sdi(i);
  const onDO=(e,i)=>{ e.preventDefault(); if(dragIdx===null||dragIdx===i)return; sdi(i); };
  const onDE=()=>wrap(async()=>{
    if(dragIdx===null) return;
    const orderedIds = machine.files.map(f=>f.id);
    await Api.reorderFiles(machine.code,orderedIds);
    await onChanged();
    sdi(null);
  });
  // إعادة الترتيب البصري الفوري أثناء السحب (محلي فقط حتى يتم الإفلات)
  const [localFiles,setLocalFiles]=useState(machine.files);
  useEffect(()=>{ setLocalFiles(machine.files); },[machine.files]);
  const onDOLive=(e,i)=>{
    e.preventDefault();
    if(dragIdx===null||dragIdx===i) return;
    const arr=[...localFiles]; const[mv]=arr.splice(dragIdx,1); arr.splice(i,0,mv);
    setLocalFiles(arr); sdi(i);
  };
  const onDEDrop=()=>wrap(async()=>{
    if(dragIdx===null) return;
    const orderedIds = localFiles.map(f=>f.id);
    sdi(null);
    await Api.reorderFiles(machine.code,orderedIds);
    await onChanged();
  });

  return(
    <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:12,overflow:"hidden",flex:1,minWidth:0,position:"relative"}}>
      {busy&&(
        <div style={{position:"absolute",top:8,left:8,zIndex:5}}><Spinner s={16}/></div>
      )}
      <div style={{padding:"11px 14px",borderBottom:"1px solid #1e2d4a",background:"#0f1830"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:6,flexWrap:"wrap"}}>
          <span style={{fontWeight:700,color:"#f97316",fontSize:13}}>{title}</span>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            <button onClick={toggle} disabled={busy}
              style={{display:"inline-flex",alignItems:"center",gap:4,background:run?"#3f1515":"#0f4c2a",color:run?"#fca5a5":"#4ade80",border:"1px solid "+(run?"#ef4444":"#22c55e"),borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>
              <I n={run?"pause":"play"} s={11}/>{run?"إيقاف":"تشغيل"}
            </button>
            <button onClick={()=>ssa(p=>!p)}
              style={{display:"inline-flex",alignItems:"center",gap:4,background:"#1e3a5f",color:"#60a5fa",border:"1px solid #1e40af",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:11,whiteSpace:"nowrap"}}>
              <I n="plus" s={11}/> إضافة
            </button>
          </div>
        </div>
        <div style={{fontSize:11,color:"#64748b",display:"flex",gap:10,flexWrap:"wrap"}}>
          <span>الحالة: <span style={{color:run?"#4ade80":"#fca5a5",fontWeight:600}}>{run?"قيد التشغيل":"متوقفة"}</span></span>
          <span>الملف: <span style={{color:"#e2e8f0"}}>{machine.files.length>0?machine.files[0].name:(machine.currentFile||"—")}</span></span>
          <span>الوقت: <span style={{color:"#60a5fa",fontFamily:"monospace"}}>{machine.totalTime}</span></span>
        </div>
        {showAdd&&(
          <div style={{marginTop:10,background:"#0a0e1a",borderRadius:8,padding:12,border:"1px solid #1e2d4a"}}>
            <div style={{fontSize:12,color:"#94a3b8",marginBottom:8,fontWeight:600}}>إضافة ملف جديد</div>
            <div style={{marginBottom:10,padding:"10px 12px",background:"#0d1224",border:"2px dashed #1e3a5f",borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <I n="clip" s={20}/>
              <span style={{color:"#64748b",fontSize:12}}>رفع من الجهاز</span>
              <input ref={fileRef} type="file" accept=".dxf,.svg,.ai,.dwg,.pdf,.png,.jpg" multiple style={{display:"none"}} onChange={handleFileInput}/>
              <button onClick={()=>fileRef.current.click()} disabled={uploading}
                style={{background:"#f97316",color:"#fff",border:"none",borderRadius:6,padding:"7px 18px",cursor:"pointer",fontSize:12,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}}>
                {uploading?<><Spinner s={13} color="#fff"/> جاري الرفع...</>:<><I n="ul" s={13}/> اختر ملفاً من الجهاز</>}
              </button>
              <div style={{fontSize:10,color:"#475569"}}>DXF • SVG • AI • DWG • PDF</div>
            </div>
            <div style={{fontSize:11,color:"#64748b",textAlign:"center",marginBottom:8}}>— أو أدخل الاسم يدوياً —</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <input value={fname} onChange={e=>sfn(e.target.value)} placeholder="اسم الملف.dxf"
                style={{flex:1,minWidth:120,background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:6,padding:"7px 10px",color:"#e2e8f0",fontSize:12,outline:"none"}}/>
              <input value={ftime} onChange={e=>sft(e.target.value)} placeholder="00:08:00"
                style={{width:86,background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:6,padding:"7px 8px",color:"#e2e8f0",fontSize:12,outline:"none",fontFamily:"monospace",direction:"ltr"}}/>
              <button onClick={()=>fname.trim()&&addByName(fname.trim())}
                style={{background:"#f97316",color:"#fff",border:"none",borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>إضافة</button>
              <button onClick={()=>ssa(false)}
                style={{background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:12}}>إلغاء</button>
            </div>
          </div>
        )}
      </div>
      <div style={{overflowX:"auto",maxHeight:320,overflowY:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:380}}>
          <thead><tr style={{background:"#0a0e1a",borderBottom:"1px solid #1e2d4a",position:"sticky",top:0,zIndex:1}}>
            {["","اسم الملف","معاينة","الحالة","الوقت","إجراءات"].map((h,i)=>(
              <th key={i} style={{padding:"7px 8px",textAlign:i===1?"right":"center",color:"#64748b",fontWeight:600}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {localFiles.map((f,i)=>(
              <tr key={f.id} className="drag-row trh"
                draggable onDragStart={()=>onDS(i)} onDragOver={e=>onDOLive(e,i)} onDragEnd={onDEDrop}
                style={{borderBottom:"1px solid #1a2744",background:dragIdx===i?"#1a2744":"transparent"}}>
                <td style={{padding:"7px 8px",textAlign:"center",color:"#475569"}}><I n="dots" s={14}/></td>
                <td style={{padding:"7px 8px",color:"#e2e8f0",maxWidth:130}}>
                  {editId===f.id?(
                    <div style={{display:"flex",gap:3}}>
                      <input value={editName} onChange={e=>sen(e.target.value)} autoFocus
                        onKeyDown={e=>e.key==="Enter"&&saveEdit(f)}
                        style={{flex:1,background:"#0a0e1a",border:"1px solid #f97316",borderRadius:4,padding:"3px 5px",color:"#e2e8f0",fontSize:11,outline:"none",minWidth:0}}/>
                      <button onClick={()=>saveEdit(f)} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"2px 5px",cursor:"pointer"}}><I n="ok" s={10}/></button>
                      <button onClick={()=>sei(null)} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:4,padding:"2px 5px",cursor:"pointer"}}><I n="x" s={10}/></button>
                    </div>
                  ):(
                    <div>
                      <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
                      {f.hasFile&&<div style={{color:"#22c55e",fontSize:9}}>📎 مرفوع</div>}
                    </div>
                  )}
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                    <ThumbCell file={f} onOpen={onOpenImage}/>
                    <input ref={el=>thumbRefs.current[f.id]=el} type="file" accept="image/png,image/jpeg,image/webp" style={{display:"none"}} onChange={e=>handleThumbInput(f,e)}/>
                   <button onClick={()=>thumbRefs.current[f.id]?.click()} onPaste={e=>handleThumbPaste(f,e)} disabled={thumbUploadingId===f.id} title={f.hasThumbnail?"تغيير الصورة (اضغط عليها ثم Ctrl+V للصق)":"إضافة صورة معاينة (اضغط عليها ثم Ctrl+V للصق)"}
                      style={{background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:4,padding:"4px 5px",cursor:"pointer"}}>
                      {thumbUploadingId===f.id?<Spinner s={10}/>:<I n="ul" s={10}/>}
                    </button>
                  </div>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}}>
                  <select value={f.status} onChange={e=>updSt(f,e.target.value)}
                    style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:4,color:"#94a3b8",padding:"3px 3px",fontSize:10,cursor:"pointer",maxWidth:90}}>
                    <option value="WAITING">انتظار</option>
                    <option value="WORKING">جاري</option>
                    <option value="CUTTING">تم القص</option>
                    <option value="DELIVERED">تسليم</option>
                  </select>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}}>
                  {editTimeId===f.id?(
                    <div style={{display:"flex",gap:2,justifyContent:"center",alignItems:"center"}}>
                      <input value={editTimeVal} onChange={e=>setETV(e.target.value)} autoFocus
                        onKeyDown={e=>e.key==="Enter"&&saveTime(f)}
                        style={{width:72,background:"#0a0e1a",border:"1px solid #f97316",borderRadius:4,padding:"3px 5px",color:"#e2e8f0",fontSize:10,outline:"none",fontFamily:"monospace",direction:"ltr",textAlign:"center"}}/>
                      <button onClick={()=>saveTime(f)} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"2px 4px",cursor:"pointer"}}><I n="ok" s={10}/></button>
                      <button onClick={()=>setETI(null)} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:4,padding:"2px 4px",cursor:"pointer"}}><I n="x" s={10}/></button>
                    </div>
                  ):(
                    <span onClick={()=>{setETI(f.id);setETV(f.time);}}
                      title="اضغط لتعديل الوقت"
                      style={{color:"#94a3b8",fontFamily:"monospace",fontSize:10,cursor:"pointer",borderBottom:"1px dashed #334155",paddingBottom:1}}>
                      {f.time}
                    </span>
                  )}
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}}>
                  <div style={{display:"flex",gap:3,justifyContent:"center"}}>
                    <button onClick={()=>{sei(f.id);sen(f.name);}} title="تعديل"
                      style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:4,padding:"4px 5px",cursor:"pointer"}}><I n="pen" s={10}/></button>
                    <button onClick={()=>download(f)} title="تحميل"
                      style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"4px 5px",cursor:"pointer"}}><I n="dl" s={10}/></button>
                    <button onClick={()=>del(f)} title="حذف"
                      style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:4,padding:"4px 5px",cursor:"pointer"}}><I n="trash" s={10}/></button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---- OPERATOR DASH ---- */
function OpDash({big,small,onChanged,addToast,onOpenImage}){
  return(
    <div>
      <h2 style={{color:"#e2e8f0",fontSize:18,fontWeight:700,marginBottom:14,marginTop:0}}>واجهة المستخدم</h2>

/* ---- USERS PAGE ---- */
function UsersPage({users,currentUser,onChanged,addToast}){
  const isRoot=currentUser?.isRoot;
  const[showAdd,ssa]=useState(false);
  const[form,sf]=useState({name:"",username:"",password:"",role:"operator",adminCode:""});
  const[err,se]=useState("");const[ok,so]=useState("");
  const[busy,sBusy]=useState(false);

  const add=async()=>{
    se("");so("");
    if(!form.name||!form.username||!form.password){se("يرجى ملء جميع الحقول");return;}
    sBusy(true);
    try{
      await Api.addUser(form);
      so("تم الإضافة بنجاح ✓");
      sf({name:"",username:"",password:"",role:"operator",adminCode:""});
      await onChanged();
      setTimeout(()=>{ssa(false);so("");},1200);

      se(e.message||"فشلت العملية");

      sBusy(false);
    }
  };

  const del=async(u)=>{
    if(!confirm(`هل تريد حذف المستخدم "${u.name}"؟`)) return;
    try{
      await Api.deleteUser(u.id);

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            {[["name","الاسم","text"],["username","اسم المستخدم","text"],["password","كلمة المرور","password"],["adminCode","كود الأدمن","password"]].map(([k,l,t])=>(
              <div key={k}>

                  <span style={{background:u.role==="admin"?"#7c2d12":"#1e3a5f",color:u.role==="admin"?"#f97316":"#60a5fa",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>

/* ---- TOASTS (إشعارات أخطاء عابرة) ---- */
function Toasts({toasts}){
  if(toasts.length===0) return null;
  return(
    <div style={{position:"fixed",bottom:16,left:16,zIndex:500,display:"flex",flexDirection:"column",gap:8,maxWidth:320}}>
      {toasts.map(t=>(
        <div key={t.id} style={{background:t.type==='error'?"#3f1515":"#0f4c2a",border:"1px solid "+(t.type==='error'?"#ef4444":"#22c55e"),color:t.type==='error'?"#fca5a5":"#4ade80",borderRadius:8,padding:"10px 14px",fontSize:12,boxShadow:"0 6px 20px rgba(0,0,0,0.4)",display:"flex",gap:6,alignItems:"center"}}>
          <I n={t.type==='error'?"warn":"ok"} s={13}/>{t.msg}
        </div>
      ))}
    </div>
  );
}

/* ---- شاشة تحميل أولية ---- */

/* ---- ROOT APP ---- */
function App(){
  const[user,su]=useState(null);
  const[page,sp]=useState("login");
  const[users,sus]=useState([]);
  const[notifs,sn]=useState([]);
  const[showN,ssN]=useState(false);
  const[showMNav,ssMN]=useState(false);
  const[logs,sl]=useState([]);
  const[big,sb]=useState(null);
  const[small,ss]=useState(null);
  const[booting,sBooting]=useState(true);
  const[authErr,sAuthErr]=useState("");
  const[toasts,sToasts]=useState([]);
  const[lightboxSrc,setLightboxSrc]=useState(null);
  const socketRef=useRef(null);

  const addToast=useCallback((msg,type='error')=>{
    const id=Date.now()+Math.random();
    sToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>sToasts(p=>p.filter(t=>t.id!==id)),4000);
  },[]);

  // -------- جلب البيانات --------
  const refreshMachines=useCallback(async()=>{
    try{
      const data=await Api.getMachines();
      sb(data.big); ss(data.small);
    }catch(e){ addToast(e.message,'error'); }
  },[addToast]);

  const refreshUsers=useCallback(async()=>{
    if(user?.role!=="admin") return;
    try{ sus(await Api.getUsers()); }
    catch(e){ /* صامت */ }
  },[user]);

  const refreshLogs=useCallback(async()=>{
    try{ sl(await Api.getLogs()); }
    catch(e){ /* صامت */ }
  },[]);

  const refreshNotifs=useCallback(async()=>{
    try{ sn(await Api.getNotifications()); }
    catch(e){ /* صامت */ }
  },[]);

  const refreshAll=useCallback(async()=>{
    await Promise.all([refreshMachines(),refreshLogs(),refreshNotifs()]);
  },[refreshMachines,refreshLogs,refreshNotifs]);

  // -------- تسجيل الدخول / التحقق من الجلسة المحفوظة --------
  useEffect(()=>{
    (async()=>{
      const token=Api.getToken();
      if(!token){ sBooting(false); return; }
      try{
        const {user:me}=await Api.me();
        su(me);
        sp(me.role==="admin"?"admin":"operator");
      }catch(e){
        Api.setToken(null);
      }finally{
        sBooting(false);
      }
    })();
  },[]);

  // بعد تسجيل الدخول الناجح: جلب كل البيانات
  useEffect(()=>{
    if(!user) return;
    refreshAll();
    if(user.role==="admin") refreshUsers();
  },[user]);

  // -------- Socket.io: التحديث اللحظي --------
  useEffect(()=>{
    if(!user) return;
    const socket = io(API_BASE, {transports:["websocket","polling"], auth:{token:Api.getToken()}});
    socketRef.current = socket;

    socket.on("machine:update",(updated)=>{
      if(updated.code==="big") sb(updated);
      else if(updated.code==="small") ss(updated);
    });
    socket.on("log:new",(log)=>{
      sl(p=>[log,...p].slice(0,200));
    });
    socket.on("notif:new",(notif)=>{
      sn(p=>[notif,...p]);
    });
    // تحديث لحظي لحالة اتصال أي مستخدم (يُطبَّق التصفية الهرمية من الباك إند مسبقاً عبر مسار /api/users)
    socket.on("presence:update",({userId,online})=>{
      sus(prev=>prev.map(u=>u.online===null||u.online===undefined?u:(u.id===userId?{...u,online}:u)));
    });

    return ()=>{ socket.disconnect(); };
  },[user]);

  const login=async(u,pw)=>{
    const res=await Api.login(u,pw); // يرمي استثناء عند الفشل (يُعالَج في Login component)
    Api.setToken(res.token);
    su(res.user);
    sp(res.user.role==="admin"?"admin":"operator");
  };

  const logout=async()=>{
    await Api.logout();
    Api.setToken(null);
    su(null); sp("login");
    sb(null); ss(null); sl([]); sn([]); sus([]);
    if(socketRef.current) socketRef.current.disconnect();
  };

  const onUserChanged = useCallback(()=>{ refreshUsers(); refreshLogs(); },[refreshUsers,refreshLogs]);

  const unread=notifs.filter(n=>!n.is_read).length;

  if(booting) return <FullLoader msg="جاري تحميل النظام..."/>;
  if(!user || page==="login") return <Login onLogin={login}/>;

  // الماكينات لم تُحمّل بعد
  if(!big || !small) return <FullLoader msg="جاري تحميل بيانات الماكينات..."/>;

  const navAdmin=[
    {id:"admin",l:"الرئيسية",n:"home"},
    {id:"users",l:"المستخدمون",n:"users"},
    {id:"logs",l:"السجل",n:"rep"},
    {id:"settings",l:"الإعدادات",n:"cog"},
  ];
  const nav=user?.role==="admin"?navAdmin:[{id:"operator",l:"الرئيسية",n:"home"}];

  const markRead=async()=>{
    sn(p=>p.map(n=>({...n,is_read:true})));
    try{ await Api.markAllRead(); }catch(e){}
  };

  return(
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",background:"#0a0e1a"}}>
      <Toasts toasts={toasts}/>
      <Lightbox src={lightboxSrc} onClose={()=>setLightboxSrc(null)}/>
      {/* TOP BAR */}
      <div style={{height:56,background:"#0d1224",borderBottom:"1px solid #1e2d4a",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 12px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>ssMN(p=>!p)} className="mobile-only"
            style={{background:"none",border:"none",color:"#f97316",cursor:"pointer",padding:4}}>
            <I n="menu" s={22}/>
          </button>
          <div style={{color:"#f97316"}} className="desktop-only"><I n="laser" s={22}/></div>
          <span className="topbar-title" style={{color:"#f97316",fontWeight:700,fontSize:14,lineHeight:1.2}}>نظام إدارة ماكينات الليزر</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{position:"relative"}}>
            <button onClick={()=>ssN(p=>!p)} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",position:"relative",display:"flex",padding:4}}>
              <I n="bell" s={20}/>
              {unread>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",borderRadius:"50%",fontSize:9,width:15,height:15,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{unread}</span>}
            </button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}>
            <span style={{color:"#94a3b8"}} className="desktop-only">{user?.name}</span>
            <span style={{background:user?.role==="admin"?"#f97316":"#3b82f6",color:"#fff",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:600}}>
              {user?.isRoot?"مشرف رئيسي":user?.role==="admin"?"مشرف":"مشغل"}
            </span>
          </div>
          <button onClick={logout} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",padding:4}}>
            <I n="out" s={18}/>
          </button>
        </div>
      </div>

      {/* NOTIFICATIONS */}
      {showN&&(
        <div style={{position:"fixed",top:56,left:8,right:8,maxWidth:320,margin:"0 auto",background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:10,zIndex:200,boxShadow:"0 10px 30px rgba(0,0,0,0.6)"}}>
          <div style={{padding:"9px 12px",borderBottom:"1px solid #1e2d4a",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:600}}>الإشعارات</span>
            <button onClick={markRead} style={{background:"none",border:"none",color:"#f97316",cursor:"pointer",fontSize:11}}>تحديد كمقروء</button>
          </div>
          {notifs.slice(0,6).map(n=>(
            <div key={n.id} style={{padding:"9px 12px",borderBottom:"1px solid #1a2744",background:n.is_read?"transparent":"#1a2744"}}>
              <div style={{fontSize:12,color:"#e2e8f0"}}>{n.message}</div>
              <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{fmtLogTime(n.created_at)}</div>
            </div>
          ))}
          {notifs.length===0&&<div style={{padding:16,textAlign:"center",color:"#475569",fontSize:12}}>لا توجد إشعارات</div>}
        </div>
      )}

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* SIDEBAR desktop */}
        <div className="desktop-only" style={{width:180,background:"#0d1224",borderLeft:"1px solid #1e2d4a",display:"flex",flexDirection:"column",flexShrink:0,paddingTop:8}}>
          {nav.map(item=>(
            <button key={item.id} onClick={()=>sp(item.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#f97316":"#94a3b8",border:"none",cursor:"pointer",fontSize:13,borderRight:page===item.id?"3px solid #f97316":"3px solid transparent",transition:"all 0.2s",textAlign:"right"}}>
              <I n={item.n} s={17}/><span>{item.l}</span>
            </button>
          ))}
          <div style={{flex:1}}/>
          {user?.isRoot&&(
            <div style={{padding:"8px 14px",borderTop:"1px solid #1e2d4a"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,color:"#f97316",fontSize:10,fontWeight:600}}>
                <I n="shield" s={11}/>مشرف رئيسي
              </div>
            </div>
          )}
        </div>

        {/* MOBILE DRAWER */}
        {showMNav&&(
          <>
            <div onClick={()=>ssMN(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:150}}/>
            <div style={{position:"fixed",top:0,right:0,width:220,height:"100vh",background:"#0d1224",borderLeft:"1px solid #1e2d4a",zIndex:160,display:"flex",flexDirection:"column",paddingTop:56}}>
              {user?.isRoot&&(
                <div style={{padding:"8px 16px",background:"#7c2d12",display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#f97316",fontWeight:600}}>
                  <I n="shield" s={13}/>مشرف رئيسي
                </div>
              )}
              {nav.map(item=>(
                <button key={item.id} onClick={()=>{sp(item.id);ssMN(false);}}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#f97316":"#94a3b8",border:"none",cursor:"pointer",fontSize:14,borderRight:page===item.id?"3px solid #f97316":"3px solid transparent",textAlign:"right"}}>
                  <I n={item.n} s={18}/><span>{item.l}</span>
                </button>
              ))}
              <div style={{flex:1}}/>
              <button onClick={()=>{logout();ssMN(false);}}
                style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",background:"transparent",color:"#ef4444",border:"none",cursor:"pointer",borderTop:"1px solid #1e2d4a",fontSize:14}}>
                <I n="out" s={18}/><span>تسجيل الخروج</span>
              </button>
            </div>
          </>
        )}

        {/* CONTENT */}
        <div style={{flex:1,overflow:"auto",padding:14}}>
          {page==="admin"&&<AdminDash big={big} small={small} onChanged={refreshMachines} addToast={addToast} onOpenImage={setLightboxSrc}/>}
          {page==="operator"&&<OpDash big={big} small={small} onChanged={refreshMachines} addToast={addToast} onOpenImage={setLightboxSrc}/>}
          {page==="users"&&user?.role==="admin"&&<UsersPage users={users} currentUser={user} onChanged={onUserChanged} addToast={addToast}/>}
          {page==="logs"&&user?.role==="admin"&&<LogsPage logs={logs} currentUser={user}/>}
          {page==="settings"&&<SettingsPage/>}
        </div>
      </div>

      {/* MOBILE BOTTOM NAV */}
      <div className="mobile-only" style={{position:"fixed",bottom:0,left:0,right:0,background:"#0d1224",borderTop:"1px solid #1e2d4a",display:"flex",zIndex:100}}>
        {nav.map(item=>(
          <button key={item.id} onClick={()=>sp(item.id)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 4px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#f97316":"#64748b",border:"none",cursor:"pointer",fontSize:9,borderTop:page===item.id?"2px solid #f97316":"2px solid transparent"}}>
            <I n={item.n} s={18}/><span>{item.l}</span>
          </button>
        ))}
      </div>

      {showN&&<div onClick={()=>ssN(false)} style={{position:"fixed",inset:0,zIndex:90}}/>}
      <div className="mobile-only" style={{height:64}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
