        </div>
      )}

      {!loading&&(
        <div style={{marginTop:14}}>
          <DetailedSessionsTable sessions={sessions}/>
        </div>
      )}
    </div>
  );
}

/* ترتيب الأيام الثابت: الجمعة → الخميس (يطابق الباك إند تمامًا) */
const DAY_ORDER = ["fri","sat","sun","mon","tue","wed","thu"];
const DAY_NAME_AR = {fri:"الجمعة",sat:"السبت",sun:"الأحد",mon:"الاثنين",tue:"الثلاثاء",wed:"الأربعاء",thu:"الخميس"};
const WEEK_LABEL_AR = {1:"الأسبوع الأول",2:"الأسبوع الثاني",3:"الأسبوع الثالث",4:"الأسبوع الرابع"};

function fmtDateStr(d){
  if(!d) return "";
  try{ return String(d).slice(0,10); }catch(e){ return d||""; }
}

/* ---- TOASTS (إشعارات أخطاء عابرة) ---- */
function Toasts({toasts}){
  if(toasts.length===0) return null;
  return(
    <div style={{position:"fixed",bottom:16,left:16,zIndex:500,display:"flex",flexDirection:"column",gap:8,maxWidth:320}}>
      {toasts.map(t=>(
        <div key={t.id} style={{background:t.type==='error'?"#3f1515":"#0f4c2a",border:"1px solid "+(t.type==='error'?"#ef4444":"#22c55e"),color:t.type==='error'?"#fca5a5":"#4ade80",borderRadius:8,padding:"10px 14px",fontSize:12,boxShadow:"0 6px 20px rgba(0,0,0,0.4)",display:"flex",gap:6,alignItems:"center"}}>
          <I n={t.type==='error'?"warn":"ok"} s={13}/>{t.msg}
        </div>
      ))}
    </div>
  );
}

/* ---- شاشة تحميل أولية ---- */
function FullLoader({msg}){
  return(
    <div style={{display:"flex",minHeight:"100vh",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:14}}>
      <Spinner s={32}/>
      <div style={{color:"#64748b",fontSize:13}}>{msg||"جاري التحميل..."}</div>
    </div>
  );
}

/* ---- Cleanup Modal (HANDOFF §9): مسح ملفات أيام أسبوع محدد مع Confirmation ---- */
function CleanupModal({grid,defaultWeekNumber,currentWorkDayId,onClose,addToast,onDone}){
  const[weekNumber,setWeekNumber]=useState(defaultWeekNumber);
  const[checked,setChecked]=useState(()=>Object.fromEntries(DAY_ORDER.map(d=>[d,true])));
  const[busy,setBusy]=useState(false);
  const week=grid.find(w=>w.weekNumber===weekNumber)||null;
  const selectedCount=Object.values(checked).filter(Boolean).length;

  function toggleDay(d){ setChecked(p=>({...p,[d]:!p[d]})); }
  function setAll(v){ setChecked(Object.fromEntries(DAY_ORDER.map(d=>[d,v]))); }

  async function handleConfirm(){
    if(!week){ addToast("الأسبوع غير موجود","error"); return; }
    const workDayIds=DAY_ORDER.filter(d=>checked[d]).map(d=>{
      const day=week.days.find(x=>x.dayName===d);
      return day?day.id:null;
    }).filter(Boolean);
    if(workDayIds.length===0){ addToast("اختر يومًا واحدًا على الأقل","error"); return; }
    const warning=`سيتم حذف كل الملفات في ${workDayIds.length} يوم/أيام من ${WEEK_LABEL_AR[weekNumber]} بلا أي استثناء (بما فيها ملفات قيد التشغيل والقطع)، من الماكينتين وقائمة الانتظار معًا.\n\nالتاريخ الإحصائي لن يتأثر.\n\nهذا الإجراء لا يمكن التراجع عنه. متابعة؟`;
    if(!window.confirm(warning)) return;
    setBusy(true);
    try{
      const result=await Api.cleanupFiles(workDayIds,currentWorkDayId);
      addToast(result.deletedCount>0?`تم حذف ${result.deletedCount} ملف/ملفات`:"لا توجد ملفات لحذفها في الأيام المختارة",'success');
      onDone();
      onClose();
    }catch(e){
      addToast(e.message||"فشل تنفيذ Cleanup",'error');
    }finally{
      setBusy(false);
    }
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:14,padding:18,width:"100%",maxWidth:420,maxHeight:"90vh",overflow:"auto"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <span style={{color:"#e2e8f0",fontWeight:700,fontSize:15}}>مسح ملفات أيام الأسبوع</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer"}}><I n="x" s={18}/></button>
        </div>

        <div style={{color:"#eab308",background:"#3a2f0d",border:"1px solid #7c5e0d",borderRadius:8,padding:"8px 10px",fontSize:11.5,marginBottom:14,lineHeight:1.6}}>
          يحذف كل الملفات في الأيام المحددة بلا أي استثناء (WAITING/WORKING/CUTTING/DELIVERED). التاريخ الإحصائي لا يتأثر أبدًا.
        </div>

        <label style={{display:"block",color:"#94a3b8",fontSize:12,marginBottom:6}}>الأسبوع</label>
        <select value={weekNumber} onChange={e=>setWeekNumber(Number(e.target.value))}
          style={{width:"100%",background:"#131b34",color:"#e2e8f0",border:"1px solid #1e2d4a",borderRadius:8,padding:"8px 10px",fontSize:12,marginBottom:14}}>
          {[1,2,3,4].map(n=>(<option key={n} value={n}>{WEEK_LABEL_AR[n]}</option>))}
        </select>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{color:"#94a3b8",fontSize:12}}>الأيام (كلها محددة افتراضيًا — ألغِ تحديد ما تريد الاحتفاظ به)</span>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setAll(true)} style={{background:"none",border:"none",color:"#60a5fa",cursor:"pointer",fontSize:11}}>تحديد الكل</button>
            <button onClick={()=>setAll(false)} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:11}}>إلغاء الكل</button>
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
          {DAY_ORDER.map(d=>(
            <label key={d} style={{display:"flex",alignItems:"center",gap:8,background:"#131b34",borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:13,color:"#e2e8f0"}}>
              <input type="checkbox" checked={!!checked[d]} onChange={()=>toggleDay(d)}/>
              {DAY_NAME_AR[d]}
            </label>
          ))}
        </div>

        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose} disabled={busy}
            style={{flex:1,background:"#131b34",color:"#94a3b8",border:"1px solid #1e2d4a",borderRadius:8,padding:"9px 14px",fontSize:13,cursor:"pointer"}}>
            إلغاء
          </button>
          <button onClick={handleConfirm} disabled={busy||selectedCount===0}
            style={{flex:1,background:"#ef4444",color:"#fff",border:"none",borderRadius:8,padding:"9px 14px",fontSize:13,fontWeight:600,cursor:busy?"default":"pointer",opacity:busy||selectedCount===0?0.6:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            {busy?<Spinner s={13} color="#fff"/>:<I n="trash" s={14}/>}
            حذف ({selectedCount})
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---- ROOT APP ---- */
function App(){
  const[user,su]=useState(null);
  const[page,sp]=useState("login");
  const[users,sus]=useState([]);
  const[notifs,sn]=useState([]);
  const[showN,ssN]=useState(false);
  const[showMNav,ssMN]=useState(false);
  const[logs,sl]=useState([]);
  const[big,sb]=useState(null);
  const[small,ss]=useState(null);
  const[queue,sq]=useState(null);
  const[booting,sBooting]=useState(true);
  const[authErr,sAuthErr]=useState("");
  const[toasts,sToasts]=useState([]);
  const[lightboxSrc,setLightboxSrc]=useState(null);
  /* شبكة استقلال الأيام: 4 أسابيع ثابتة × 7 أيام (الجمعة→الخميس) — كل خانة مستقلة تمامًا ولها ملفاتها الخاصة */
  const[grid,sGrid]=useState([]);
  const[weekNumber,setWeekNumber]=useState(1);
  const[dayName,setDayName]=useState(DAY_ORDER[0]);
  const[showCleanup,setShowCleanup]=useState(false);
  const socketRef=useRef(null);

  const currentWeek=grid.find(w=>w.weekNumber===weekNumber)||null;
  const currentDay=currentWeek? currentWeek.days.find(d=>d.dayName===dayName) : null;
  const workDayId=currentDay? currentDay.id : null;

  const addToast=useCallback((msg,type='error')=>{
    const id=Date.now()+Math.random();
    sToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>sToasts(p=>p.filter(t=>t.id!==id)),4000);
  },[]);

  // -------- جلب البيانات --------
  // workDayId مطلوب: كل استدعاء يجلب فقط ملفات الخانة (الأسبوع × اليوم) المختارة حاليًا في الهيدر
  const refreshMachines=useCallback(async()=>{
    try{
      const data=await Api.getMachines(workDayId);
      sb(data.big); ss(data.small); sq(data.queue||null);
    }catch(e){ addToast(e.message,'error'); }
  },[addToast,workDayId]);

  const refreshUsers=useCallback(async()=>{
    if(user?.role!=="admin") return;
    try{ sus(await Api.getUsers()); }
    catch(e){ /* صامت */ }
  },[user]);

  const refreshLogs=useCallback(async()=>{
    try{ sl(await Api.getLogs()); }
    catch(e){ /* صامت */ }
  },[]);

  const refreshNotifs=useCallback(async()=>{
    try{ sn(await Api.getNotifications()); }
    catch(e){ /* صامت */ }
  },[]);

  const refreshWorkGrid=useCallback(async()=>{
    try{ sGrid(await Api.getWorkGrid()); }
    catch(e){ /* صامت */ }
  },[]);

  const refreshAll=useCallback(async()=>{
    await Promise.all([refreshMachines(),refreshLogs(),refreshNotifs()]);
  },[refreshMachines,refreshLogs,refreshNotifs]);

  // -------- تسجيل الدخول / التحقق من الجلسة المحفوظة --------
  useEffect(()=>{
    (async()=>{
      const token=Api.getToken();
      if(!token){ sBooting(false); return; }
      try{
        const {user:me}=await Api.me();
        su(me);
        sp(me.role==="admin"?"admin":"operator");
      }catch(e){
        Api.setToken(null);
      }finally{
        sBooting(false);
      }
    })();
  },[]);

  // بعد تسجيل الدخول الناجح: جلب كل البيانات (شبكة الأيام/الأسابيع متاحة لأي مستخدم مسجّل دخول)
  useEffect(()=>{
    if(!user) return;
    refreshAll();
    refreshWorkGrid();
    if(user.role==="admin"){ refreshUsers(); }
  },[user]);

  // إعادة جلب الماكينات فور تغيّر الخانة المختارة (الأسبوع × اليوم) — استقلال تام بين الخانات
  useEffect(()=>{
    if(!user || !workDayId) return;
    refreshMachines();
  },[user,workDayId]);

  // -------- Socket.io: التحديث اللحظي --------
  useEffect(()=>{
    if(!user) return;
    const socket = io(API_BASE, {transports:["websocket","polling"], auth:{token:Api.getToken()}});
    socketRef.current = socket;

    socket.on("machine:update",(updated)=>{
      if(updated.code==="big") sb(updated);
      else if(updated.code==="small") ss(updated);
      else if(updated.code==="queue") sq(updated);
    });
    socket.on("log:new",(log)=>{
      sl(p=>[log,...p].slice(0,200));
    });
    socket.on("notif:new",(notif)=>{
      sn(p=>[notif,...p]);
    });
    // تحديث لحظي لحالة اتصال أي مستخدم (يُطبَّق التصفية الهرمية من الباك إند مسبقاً عبر مسار /api/users)
    socket.on("presence:update",({userId,online})=>{
      sus(prev=>prev.map(u=>u.online===null||u.online===undefined?u:(u.id===userId?{...u,online}:u)));
    });
    // ملاحظة: أحداث "workday:update"/"workweek:new" أُزيلت من الباك إند — شبكة الأسابيع/الأيام أصبحت
    // ثابتة (4×7 خانة مزروعة مسبقًا) ولا تتغيّر بعد الإنشاء، فلا حاجة لبثّ لحظي بشأنها.
    // 🆕 تحديث لحظي لقائمة المستخدمين عند إضافة/حذف مستخدم من جلسة أخرى (غرفة admins فقط من طرف السيرفر)
    socket.on("user:new",(newUser)=>{
      sus(prev=>prev.some(u=>u.id===newUser.id)?prev:[...prev,newUser]);
    });
    socket.on("user:deleted",({id})=>{
      sus(prev=>prev.filter(u=>u.id!==id));
    });

    // 🆕 Auto-Sync احتياطي: عند فقد اتصال Socket.io، نبدأ جلباً دورياً (كل 20 ثانية) كخط دفاع ثانٍ
    // حتى يعود الاتصال — عندها نوقف الجلب الدوري فوراً ونعمل جلباً فورياً واحداً لالتقاط أي تحديثات
    // فاتت أثناء الانقطاع. هذا ليس Polling دائماً — يعمل فقط أثناء انقطاع الاتصال أو عند استعادته.
    let fallbackInterval=null;
    let hasConnectedBefore=false;
    const stopFallback=()=>{
      if(fallbackInterval){ clearInterval(fallbackInterval); fallbackInterval=null; }
    };
    const catchUpSync=()=>{
      refreshAll();
      if(user.role==="admin"){ refreshUsers(); }
    };
    socket.on("disconnect",()=>{
      stopFallback();
      fallbackInterval=setInterval(catchUpSync,20000);
    });
    socket.on("connect",()=>{
      stopFallback();
      // أول اتصال عند فتح الصفحة: البيانات مجلوبة أصلاً عبر useEffect تسجيل الدخول، لا داعي لتكرارها.
      // أي اتصال لاحق (إعادة اتصال بعد انقطاع) يستدعي جلباً فورياً لالتقاط ما فات.
      if(hasConnectedBefore) catchUpSync();
      hasConnectedBefore=true;
    });

    return ()=>{ stopFallback(); socket.disconnect(); };
  },[user]);

  const login=async(u,pw)=>{
    const res=await Api.login(u,pw); // يرمي استثناء عند الفشل (يُعالَج في Login component)
    Api.setToken(res.token);
    su(res.user);
    sp(res.user.role==="admin"?"admin":"operator");
  };

  const logout=async()=>{
    await Api.logout();
    Api.setToken(null);
    su(null); sp("login");
    sb(null); ss(null); sq(null); sl([]); sn([]); sus([]);
    if(socketRef.current) socketRef.current.disconnect();
  };

  const onUserChanged = useCallback(()=>{ refreshUsers(); refreshLogs(); },[refreshUsers,refreshLogs]);

  const unread=notifs.filter(n=>!n.is_read).length;

  if(booting) return <FullLoader msg="جاري تحميل النظام..."/>;
  if(!user || page==="login") return <Login onLogin={login}/>;

  // الماكينات لم تُحمّل بعد
  if(!big || !small) return <FullLoader msg="جاري تحميل بيانات الماكينات..."/>;

  const navAdmin=[
    {id:"admin",l:"الرئيسية",n:"home"},
    {id:"users",l:"المستخدمون",n:"users"},
    {id:"logs",l:"السجل",n:"rep"},
    {id:"notifications",l:"الإشعارات",n:"bell"},
    {id:"statistics",l:"الإحصائيات",n:"chart"},
  ];
  const nav=user?.role==="admin"?navAdmin:[
    {id:"operator",l:"الرئيسية",n:"home"},
    {id:"notifications",l:"الإشعارات",n:"bell"},
  ];

  const markRead=async()=>{
    sn(p=>p.map(n=>({...n,is_read:true})));
    try{ await Api.markAllRead(); }catch(e){}
  };

  return(
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh",background:"#0a0e1a"}}>
      <Toasts toasts={toasts}/>
      <Lightbox src={lightboxSrc} onClose={()=>setLightboxSrc(null)}/>
      {/* TOP BAR */}
      <div style={{height:56,background:"#0d1224",borderBottom:"1px solid #1e2d4a",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 12px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>ssMN(p=>!p)} className="mobile-only"
            style={{background:"none",border:"none",color:"#e06a24",cursor:"pointer",padding:4}}>
            <I n="menu" s={22}/>
          </button>
          <img src={LOGO_B64} alt="Tashkeel CNC" className="desktop-only" style={{height:26,width:"auto"}}/>
          <span className="topbar-title" style={{color:"#e06a24",fontWeight:700,fontSize:14,lineHeight:1.2}}>نظام إدارة ماكينات الليزر</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:6,background:"#131b34",border:"1px solid #1e2d4a",borderRadius:8,padding:"5px 10px",color:"#94a3b8",fontSize:12,fontFamily:"monospace"}}>
            <I n="cal" s={14}/>
            <span>{todayDateStr()}</span>
          </div>
          <div style={{position:"relative"}}>
            <button onClick={()=>ssN(p=>!p)} style={{background:"none",border:"none",color:"#94a3b8",cursor:"pointer",position:"relative",display:"flex",padding:4}}>
              <I n="bell" s={20}/>
              {unread>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",borderRadius:"50%",fontSize:9,width:15,height:15,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{unread}</span>}
            </button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}>
            <span style={{color:"#94a3b8"}} className="desktop-only">{user?.name}</span>
            <span style={{background:user?.isRoot?"#8e3537":user?.role==="admin"?"#e06a24":"#3b82f6",color:"#fff",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:600}}>
              {user?.isRoot?"مشرف رئيسي":user?.role==="admin"?"مشرف":"مشغل"}
            </span>
          </div>
          <button onClick={logout} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",padding:4}}>
            <I n="out" s={18}/>
          </button>
        </div>
      </div>

      {/* شريط اختيار الأسبوع واليوم — الأيام السبعة مستقلة تمامًا (الجمعة→الخميس) × 4 أسابيع */}
      {(page==="admin"||page==="operator")&&(
        <div className="mobile-stack" style={{background:"#0d1224",borderBottom:"1px solid #1e2d4a",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"8px 12px",position:"sticky",top:56,zIndex:90,flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {DAY_ORDER.map(d=>(
              <button key={d} onClick={()=>setDayName(d)}
                style={{background:dayName===d?"#e06a24":"#131b34",color:dayName===d?"#fff":"#94a3b8",border:"none",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer",transition:"all 0.15s"}}>
                {DAY_NAME_AR[d]}
              </button>
            ))}
          </div>
          <select value={weekNumber} onChange={e=>setWeekNumber(Number(e.target.value))}
            style={{background:"#131b34",color:"#e2e8f0",border:"1px solid #1e2d4a",borderRadius:8,padding:"7px 12px",fontSize:12,cursor:"pointer"}}>
            {[1,2,3,4].map(n=>(<option key={n} value={n}>{WEEK_LABEL_AR[n]}</option>))}
          </select>
          {user?.role==="admin"&&page==="admin"&&(
            <button onClick={()=>setShowCleanup(true)} title="مسح ملفات أيام الأسبوع"
              style={{display:"flex",alignItems:"center",gap:6,background:"#131b34",color:"#ef4444",border:"1px solid #3a1e1e",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>
              <I n="trash" s={13}/>Cleanup
            </button>
          )}
        </div>
      )}

      {showCleanup&&(
        <CleanupModal grid={grid} defaultWeekNumber={weekNumber} currentWorkDayId={workDayId}
          onClose={()=>setShowCleanup(false)} addToast={addToast} onDone={refreshMachines}/>
      )}

      {/* NOTIFICATIONS */}
      {showN&&(
        <div style={{position:"fixed",top:56,left:8,right:8,maxWidth:320,margin:"0 auto",background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:10,zIndex:200,boxShadow:"0 10px 30px rgba(0,0,0,0.6)"}}>
          <div style={{padding:"9px 12px",borderBottom:"1px solid #1e2d4a",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:600}}>الإشعارات</span>
            <button onClick={markRead} style={{background:"none",border:"none",color:"#e06a24",cursor:"pointer",fontSize:11}}>تحديد كمقروء</button>
          </div>
          {notifs.slice(0,6).map(n=>{
            const tc=NOTIF_TYPE_CONFIG[n.type]||NOTIF_TYPE_CONFIG.file;
            return(
              <div key={n.id} style={{display:"flex",gap:8,padding:"9px 12px",borderBottom:"1px solid #1a2744",background:n.is_read?"transparent":"#1a2744"}}>
                <div style={{background:tc.bg,color:tc.color,borderRadius:6,padding:"3px 5px",flexShrink:0,height:"fit-content"}}><I n={tc.icon} s={12}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:"#e2e8f0"}}>{n.message}</div>
                  <div style={{fontSize:10,color:"#64748b",marginTop:2}}>{fmtLogTime(n.created_at)}</div>
                </div>
              </div>
            );
          })}
          {notifs.length===0&&<div style={{padding:16,textAlign:"center",color:"#475569",fontSize:12}}>لا توجد إشعارات</div>}
          <button onClick={()=>{ssN(false);sp("notifications");}}
            style={{width:"100%",background:"none",border:"none",borderTop:"1px solid #1e2d4a",color:"#94a3b8",cursor:"pointer",fontSize:12,padding:"9px 12px"}}>
            عرض كل الإشعارات
          </button>
        </div>
      )}

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* SIDEBAR desktop */}
        <div className="desktop-only" style={{width:180,background:"#0d1224",borderLeft:"1px solid #1e2d4a",display:"flex",flexDirection:"column",flexShrink:0,paddingTop:8}}>
          {nav.map(item=>(
            <button key={item.id} onClick={()=>sp(item.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#e06a24":"#94a3b8",border:"none",cursor:"pointer",fontSize:13,borderRight:page===item.id?"3px solid #e06a24":"3px solid transparent",transition:"all 0.2s",textAlign:"right"}}>
              <I n={item.n} s={17}/><span>{item.l}</span>
            </button>
          ))}
          <div style={{flex:1}}/>
          {user?.isRoot&&(
            <div style={{padding:"8px 14px",borderTop:"1px solid #1e2d4a"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,color:"#e06a24",fontSize:10,fontWeight:600}}>
                <I n="shield" s={11}/>مشرف رئيسي
              </div>
            </div>
          )}
        </div>

        {/* MOBILE DRAWER */}
        {showMNav&&(
          <>
            <div onClick={()=>ssMN(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:150}}/>
            <div style={{position:"fixed",top:0,right:0,width:220,height:"100vh",background:"#0d1224",borderLeft:"1px solid #1e2d4a",zIndex:160,display:"flex",flexDirection:"column",paddingTop:56}}>
              {user?.isRoot&&(
                <div style={{padding:"8px 16px",background:"#7c2d12",display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#e06a24",fontWeight:600}}>
                  <I n="shield" s={13}/>مشرف رئيسي
                </div>
              )}
              {nav.map(item=>(
                <button key={item.id} onClick={()=>{sp(item.id);ssMN(false);}}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#e06a24":"#94a3b8",border:"none",cursor:"pointer",fontSize:14,borderRight:page===item.id?"3px solid #e06a24":"3px solid transparent",textAlign:"right"}}>
                  <I n={item.n} s={18}/><span>{item.l}</span>
                </button>
              ))}
              <div style={{flex:1}}/>
              <button onClick={()=>{logout();ssMN(false);}}
                style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",background:"transparent",color:"#ef4444",border:"none",cursor:"pointer",borderTop:"1px solid #1e2d4a",fontSize:14}}>
                <I n="out" s={18}/><span>تسجيل الخروج</span>
              </button>
            </div>
          </>
        )}

        {/* CONTENT */}
        <div style={{flex:1,overflow:"auto",padding:14}}>
          {page==="admin"&&<AdminDash big={big} small={small} queue={queue} onChanged={refreshMachines} addToast={addToast} onOpenImage={setLightboxSrc} workDayId={workDayId}/>}
          {page==="operator"&&<OpDash big={big} small={small} onChanged={refreshMachines} addToast={addToast} onOpenImage={setLightboxSrc}/>}
          {page==="users"&&user?.role==="admin"&&<UsersPage users={users} currentUser={user} onChanged={onUserChanged} addToast={addToast}/>}
          {page==="logs"&&user?.role==="admin"&&<LogsPage logs={logs} currentUser={user}/>}
          {page==="notifications"&&<NotificationsPage addToast={addToast} onMarkAllRead={markRead}/>}
          {page==="statistics"&&user?.role==="admin"&&<StatisticsPage addToast={addToast} socket={socketRef.current}/>}
        </div>
      </div>

      {/* MOBILE BOTTOM NAV */}
      <div className="mobile-only" style={{position:"fixed",bottom:0,left:0,right:0,background:"#0d1224",borderTop:"1px solid #1e2d4a",display:"flex",zIndex:100}}>
        {nav.map(item=>(
          <button key={item.id} onClick={()=>sp(item.id)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"8px 4px",background:page===item.id?"#1a2744":"transparent",color:page===item.id?"#e06a24":"#64748b",border:"none",cursor:"pointer",fontSize:9,borderTop:page===item.id?"2px solid #e06a24":"2px solid transparent"}}>
            <I n={item.n} s={18}/><span>{item.l}</span>
          </button>
        ))}
      </div>

      {showN&&<div onClick={()=>ssN(false)} style={{position:"fixed",inset:0,zIndex:90}}/>}
      <div className="mobile-only" style={{height:64}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
