*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;color:#e2e8f0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#0a0e1a;}
::-webkit-scrollbar-thumb{background:#1e2d4a;border-radius:2px;}
.trh:hover{background:#0f1830!important;}
.drag-row{cursor:grab;}
input::placeholder{color:#475569;}
button{transition:opacity 0.15s;}
button:active{opacity:0.8;}
button:disabled{opacity:0.5;cursor:not-allowed!important;}
select option{background:#0d1224;color:#e2e8f0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.pulse{animation:pulse 2s infinite;}
.spin{animation:spin 1s linear infinite;}
@media(max-width:700px){
  .desktop-only{display:none!important;}
  .mobile-stack{flex-direction:column!important;}
  .topbar-title{font-size:12px!important;}
}
@media(min-width:701px){
  .mobile-only{display:none!important;}
}

/* ====================================================================
   طبقة الاتصال بالـ API
==================================================================== */
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

const Api = {
  token: safeGet("laser_token") || null,
  setToken(t){ this.token=t; if(t) safeSet("laser_token",t); else safeRemove("laser_token"); },
  getToken(){ return this.token; },

  async request(path, {method="GET", body=null, isForm=false, raw=false}={}){
    const headers = {};
    if(this.token) headers["Authorization"] = "Bearer "+this.token;
    if(!isForm) headers["Content-Type"]="application/json";

    const opts = { method, headers };
    if(body!==null) opts.body = isForm ? body : JSON.stringify(body);

    let res;
    try{
      res = await fetch(API_BASE+path, opts);
    }catch(netErr){
      throw new Error("تعذّر الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت أو أن السيرفر يعمل.");
    }

    if(raw) return res;

    let data=null;
    try{ data = await res.json(); }catch(e){ /* قد لا يوجد body */ }

    if(!res.ok){
      const msg = (data && data.error) ? data.error : ("خطأ غير متوقع ("+res.status+")");
      throw new Error(msg);
    }
    return data;
  },

  login(username,password){ return this.request("/api/auth/login",{method:"POST",body:{username,password}}); },
  me(){ return this.request("/api/auth/me"); },
  logout(){ return this.request("/api/auth/logout",{method:"POST"}).catch(()=>{}); },

  getUsers(){ return this.request("/api/users"); },
  addUser(payload){ return this.request("/api/users",{method:"POST",body:payload}); },
  deleteUser(id){ return this.request("/api/users/"+id,{method:"DELETE"}); },

  getMachines(workDayId){ return this.request("/api/machines"+(workDayId?("?workDayId="+workDayId):"")); },
  toggleMachine(code,workDayId){ return this.request("/api/machines/"+code+"/toggle"+(workDayId?("?workDayId="+workDayId):""),{method:"PATCH"}); },
  addFileByName(code,name,time,workDayId){ return this.request("/api/machines/"+code+"/files",{method:"POST",body:{name,time,workDayId}}); },
  uploadFile(code,file,time,workDayId){
    const fd = new FormData();
    fd.append("file",file);
    fd.append("time",time);
    fd.append("workDayId",workDayId);
    return this.request("/api/machines/"+code+"/files/upload",{method:"POST",body:fd,isForm:true});
  },
  renameFile(fileId,name,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/name",{method:"PATCH",body:{name,machineCode,machineLabel}}); },
  setFileTime(fileId,time,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/time",{method:"PATCH",body:{time,machineCode,machineLabel}}); },
  setFileStatus(fileId,status,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/status",{method:"PATCH",body:{status,machineCode,machineLabel}}); },
  deleteFile(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId,{method:"DELETE",body:{machineCode,machineLabel}}); },
  reorderFiles(code,orderedIds,workDayId){ return this.request("/api/machines/"+code+"/files/reorder",{method:"PATCH",body:{orderedIds,workDayId}}); },
  downloadFileUrl(fileId){ return API_BASE+"/api/machines/files/"+fileId+"/download"; },
  uploadThumbnail(fileId,file,machineCode,machineLabel){
    const fd=new FormData();
    fd.append("thumbnail",file);
    fd.append("machineCode",machineCode);
    fd.append("machineLabel",machineLabel);
    return this.request("/api/machines/files/"+fileId+"/thumbnail",{method:"POST",body:fd,isForm:true});
  },
  deleteThumbnail(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/thumbnail",{method:"DELETE",body:{machineCode,machineLabel}}); },
  thumbnailUrl(fileId,nonce){ return API_BASE+"/api/machines/files/"+fileId+"/thumbnail?token="+encodeURIComponent(this.token||"")+(nonce?"&v="+encodeURIComponent(nonce):""); },

  setTextComment(fileId,text,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/comment",{method:"POST",body:{text,machineCode,machineLabel}}); },
  deleteTextComment(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/comment",{method:"DELETE",body:{machineCode,machineLabel}}); },

  uploadVoiceComment(fileId,blob,machineCode,machineLabel){
    const fd=new FormData();
    fd.append("voice",blob,"voice.webm");
    fd.append("machineCode",machineCode);
    fd.append("machineLabel",machineLabel);
    return this.request("/api/machines/files/"+fileId+"/voice",{method:"POST",body:fd,isForm:true});
  },
  deleteVoiceComment(fileId,machineCode,machineLabel){ return this.request("/api/machines/files/"+fileId+"/voice",{method:"DELETE",body:{machineCode,machineLabel}}); },
  voiceCommentUrl(fileId){ return API_BASE+"/api/machines/files/"+fileId+"/voice?token="+encodeURIComponent(this.token||""); },

  moveFile(fileId,targetMachineCode){ return this.request("/api/machines/files/"+fileId+"/move",{method:"PATCH",body:{targetMachineCode}}); },
  bulkMoveFiles(fileIds,targetMachineCode,workDayId){ return this.request("/api/machines/files/bulk-move",{method:"PATCH",body:{fileIds,targetMachineCode,workDayId}}); },
  transferWaiting(workDayId){ return this.request("/api/machines/files/transfer-waiting",{method:"POST",body:{workDayId}}); },
  cleanupFiles(workDayIds,currentWorkDayId){ return this.request("/api/machines/files/cleanup",{method:"DELETE",body:{workDayIds,currentWorkDayId}}); },
  bulkDeleteFiles(fileIds,machineLabel){ return this.request("/api/machines/files/bulk-delete",{method:"DELETE",body:{fileIds,machineLabel}}); },

  getLogs(){ return this.request("/api/logs"); },
  getNotifications(){ return this.request("/api/notifications"); },
  markAllRead(){ return this.request("/api/notifications/read-all",{method:"PATCH"}); },
  getAllNotifications({type,page,limit}={}){
    const qs=new URLSearchParams();
    if(type) qs.set("type",type);
    if(page) qs.set("page",page);
    if(limit) qs.set("limit",limit);
    const q=qs.toString();
    return this.request("/api/notifications/all"+(q?"?"+q:""));
  },
  getMachineStats({scope,weekStart,year,month,machineCode}){
    const qs=new URLSearchParams({scope});
    if(weekStart) qs.set("weekStart",weekStart);
    if(year) qs.set("year",year);
    if(month) qs.set("month",month);
    if(machineCode) qs.set("machineCode",machineCode);
    return this.request("/api/statistics/machines?"+qs.toString());
  },
  deleteMachineDayStats(machineCode,date){ return this.request("/api/statistics/machines/day",{method:"DELETE",body:{machineCode,date}}); },
  getOperatorStats({scope,weekStart,year,month,userId}){
    const qs=new URLSearchParams({scope});
    if(weekStart) qs.set("weekStart",weekStart);
    if(year) qs.set("year",year);
    if(month) qs.set("month",month);
    if(userId) qs.set("userId",userId);
    return this.request("/api/statistics/operators?"+qs.toString());
  },
  getOperatorSessions({scope,weekStart,year,month,userId}){
    const qs=new URLSearchParams({scope});
    if(weekStart) qs.set("weekStart",weekStart);
    if(year) qs.set("year",year);
    if(month) qs.set("month",month);
    if(userId) qs.set("userId",userId);
    return this.request("/api/statistics/operators/sessions?"+qs.toString());
  },

  // شبكة استقلال الأيام: 4 أسابيع ثابتة × 7 أيام (الجمعة→الخميس)، كل خانة لها id دائم
  getWorkGrid(){ return this.request("/api/work/grid"); },
  getWorkWeeks(){ return this.request("/api/work/weeks"); },
};

function t2s(t){if(!t)return 0;const[h,m,s]=t.split(":").map(Number);return(h||0)*3600+(m||0)*60+(s||0);}
function s2t(s){s=Math.max(0,s);return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");}

function fmtLogTime(iso){
  try{ return new Date(iso).toLocaleTimeString("ar-EG",{hour12:false}); }
  catch(e){ return iso||""; }
}

/* ---- تحميل ملف فعلياً على الجهاز (بدل فتح تبويب جديد بالمتصفح) ----
   ملاحظة مهمة: خاصية a[download] لا تعمل عبر الدومينات المختلفة (cross-origin) —
   وهذا وضعنا الفعلي لأن الفرونت إند والباك إند على رابطين مختلفين على Render.
   المتصفح في هذه الحالة يتجاهل download تماماً ويفتح الملف بدل تنزيله.
   الحل الموثوق: نجلب الملف عبر fetch كـ Blob (مع توكن الدخول)، ثم ننشئ
   رابط تحميل محلي من نفس أصل الصفحة (blob:) فيعمل التنزيل الفعلي دائماً. */
async function triggerDownload(url, filename){
  const res = await fetch(url, {
    headers: Api.token ? { "Authorization": "Bearer "+Api.token } : {}
  });
  if(!res.ok) throw new Error("فشل تحميل الملف من السيرفر");
  const blob = await res.blob();
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = filename || "file";
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(blobUrl), 4000);
}

/* ---- زر/مؤشر التعليق الكتابي: يظهر فقط إن وُجد تعليق (للجميع)، ونافذة تعديل (للمشرف) ---- */
function TextCommentCell({file,canEdit,onSave,onDelete}){
  const[open,setOpen]=useState(false);
  const[editing,setEditing]=useState(false);
  const[val,setVal]=useState(file.textComment||"");
  const[busy,setBusy]=useState(false);
  const[pos,setPos]=useState({top:0,left:0});
  const btnRef=useRef(null);
  const has=file.hasTextComment;

  const openMenu=()=>{
    const r=btnRef.current.getBoundingClientRect();
    const W=220;
    setPos({top:r.bottom+6,left:Math.min(Math.max(8,r.left),window.innerWidth-W-8)});
    setOpen(true);
  };
  const closeMenu=()=>{setOpen(false);setEditing(false);};
  const popupRef=useRef(null);

  // إعادة حساب موضع القائمة المنبثقة بدقة بعد ظهورها فعلياً في الصفحة (عبر Portal)،
  // لأن القائمة قد تُقص أو تظهر خارج حدود الجدول القابل للتمرير أفقياً/رأسياً إن لم تُحسب بدقة
  useLayoutEffect(()=>{
    if(!open || !btnRef.current || !popupRef.current) return;
    const r=btnRef.current.getBoundingClientRect();
    const pr=popupRef.current.getBoundingClientRect();
    let top=r.bottom+6;
    if(top+pr.height>window.innerHeight-8){
      top=Math.max(8,r.top-pr.height-6);
    }
    let left=Math.min(r.left,window.innerWidth-pr.width-8);
    left=Math.max(8,left);
    if(top!==pos.top||left!==pos.left) setPos({top,left});
  },[open,editing]);

  useEffect(()=>{
    if(!open) return;
    const onScrollOrResize=(e)=>{
      if(popupRef.current && e.target && popupRef.current.contains(e.target)) return; // تجاهل التمرير داخل مربع النص نفسه
      closeMenu();
    };
    window.addEventListener("scroll",onScrollOrResize,true);
    window.addEventListener("resize",onScrollOrResize);
    return()=>{
      window.removeEventListener("scroll",onScrollOrResize,true);
      window.removeEventListener("resize",onScrollOrResize);
    };
  },[open]);

  const save=async()=>{
    if(!val.trim()) return;
    setBusy(true);
    try{ await onSave(file,val.trim()); setEditing(false); }
    finally{ setBusy(false); }
  };
  const remove=async()=>{
    setBusy(true);
    try{ await onDelete(file); setOpen(false); setEditing(false); }
    finally{ setBusy(false); }
  };

  if(!has && !canEdit) return null; // المشغّل: لا يظهر شيء إن لم يوجد تعليق

  const isAddNew = !has && canEdit;

  return (
    <div style={{position:"relative",display:"inline-block"}}>
      <button ref={btnRef}
        onClick={()=>{
          if(open){ closeMenu(); }
          else{ if(isAddNew){ setEditing(true); setVal(""); } openMenu(); }
        }}
        title={isAddNew?"إضافة تعليق كتابي":"عرض التعليق الكتابي"}
        style={isAddNew
          ? {background:"transparent",color:"#334155",border:"1px dashed #334155",borderRadius:4,padding:"3px 4px",cursor:"pointer",display:"inline-flex"}
          : {background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:4,padding:"3px 4px",cursor:"pointer",display:"inline-flex"}}>
        <I n="comment" s={11}/>
      </button>
      {open&&ReactDOM.createPortal(
        <>
          <div onClick={closeMenu} style={{position:"fixed",inset:0,zIndex:9998}}/>
          <div ref={popupRef} style={{position:"fixed",top:pos.top,left:pos.left,zIndex:9999,background:"#0d1224",border:"1px solid #1e3a5f",borderRadius:8,padding:10,width:220,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
            {editing?(
              <>
                <textarea value={val} onChange={e=>setVal(e.target.value)} autoFocus rows={3}
                  style={{width:"100%",background:"#0a0e1a",border:"1px solid #e06a24",borderRadius:6,padding:6,color:"#e2e8f0",fontSize:11,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
                <div style={{display:"flex",gap:5,marginTop:6}}>
                  <button onClick={save} disabled={busy||!val.trim()} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:5,padding:"4px 9px",cursor:"pointer",fontSize:11,flex:1}}>{busy?"...":"حفظ"}</button>
                  <button onClick={()=>{ if(isAddNew){ closeMenu(); } else { setEditing(false); setVal(file.textComment||""); } }} style={{background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:5,padding:"4px 9px",cursor:"pointer",fontSize:11}}>إلغاء</button>
                </div>
              </>
            ):(
              <>
                <div style={{color:"#e2e8f0",fontSize:12,whiteSpace:"pre-wrap",wordBreak:"break-word",maxHeight:120,overflowY:"auto"}}>{file.textComment}</div>
                {canEdit&&(
                  <div style={{display:"flex",gap:5,marginTop:8,borderTop:"1px solid #1a2744",paddingTop:6}}>
                    <button onClick={()=>setEditing(true)} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:5,padding:"4px 9px",cursor:"pointer",fontSize:11,flex:1}}>تعديل</button>
                    <button onClick={remove} disabled={busy} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:5,padding:"4px 9px",cursor:"pointer",fontSize:11}}>حذف</button>
                  </div>
                )}
              </>
            )}
          </div>
        </>,
        document.body
      )}
    </div>
  );
}

  const openMenu=(w)=>{
    const r=btnRef.current.getBoundingClientRect();
    setPos({top:r.bottom+6,left:Math.min(Math.max(8,r.left),window.innerWidth-w-8)});
    setOpen(true);
  };
  const popupRef=useRef(null);

  useLayoutEffect(()=>{
    if(!open || !btnRef.current || !popupRef.current) return;
    const r=btnRef.current.getBoundingClientRect();
    const pr=popupRef.current.getBoundingClientRect();
    let top=r.bottom+6;
    if(top+pr.height>window.innerHeight-8){
      top=Math.max(8,r.top-pr.height-6);
    }
    let left=Math.min(r.left,window.innerWidth-pr.width-8);
    left=Math.max(8,left);
    if(top!==pos.top||left!==pos.left) setPos({top,left});
  },[open,recording,busy]);

  useEffect(()=>{
    if(!open) return;
    const onScrollOrResize=()=>{ if(!recording) setOpen(false); };
    window.addEventListener("scroll",onScrollOrResize,true);
    window.addEventListener("resize",onScrollOrResize);
    return()=>{
      window.removeEventListener("scroll",onScrollOrResize,true);
      window.removeEventListener("resize",onScrollOrResize);
    };
  },[open,recording]);

  const startRecording=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const rec=new MediaRecorder(stream);
      chunksRef.current=[];
      rec.ondataavailable=e=>chunksRef.current.push(e.data);
      rec.onstop=async()=>{
        const blob=new Blob(chunksRef.current,{type:"audio/webm"});
        stream.getTracks().forEach(t=>t.stop());
        setBusy(true);
        try{ await onUpload(file,blob); setOpen(false); }
        finally{ setBusy(false); }
      };
      rec.start();
      mediaRef.current=rec;
      setRecording(true);
    }catch(e){
      alert("تعذّر الوصول للميكروفون. تأكد من منح الإذن للموقع.");
    }
  };
  const stopRecording=()=>{
    mediaRef.current?.stop();
    setRecording(false);
  };

  const togglePlay=()=>{
    if(!audioRef.current) return;
    if(playing){ audioRef.current.pause(); }
    else{ audioRef.current.play(); }
  };

  const remove=async()=>{
    setBusy(true);
    try{ await onDelete(file); setOpen(false); }
    finally{ setBusy(false); }
  };

  if(!has && !canEdit) return null;

  if(!has && canEdit){
    return (
      <div style={{position:"relative",display:"inline-block"}}>
        <button ref={btnRef} onClick={()=>{open?setOpen(false):openMenu(170);}} title="إضافة تعليق صوتي"
          style={{background:"transparent",color:"#334155",border:"1px dashed #334155",borderRadius:4,padding:"3px 4px",cursor:"pointer",display:"inline-flex"}}>
          <I n="mic" s={11}/>
        </button>
        {open&&ReactDOM.createPortal(
          <>
            <div onClick={()=>{ if(!recording) setOpen(false); }} style={{position:"fixed",inset:0,zIndex:9998}}/>
            <div ref={popupRef} onClick={e=>e.stopPropagation()} style={{position:"fixed",top:pos.top,left:pos.left,zIndex:9999,background:"#0d1224",border:"1px solid #1e3a5f",borderRadius:8,padding:10,width:170,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
              {busy?(
                <div style={{color:"#94a3b8",fontSize:11,textAlign:"center"}}><Spinner s={14}/> جاري الرفع...</div>
              ):recording?(
                <button onClick={stopRecording} style={{width:"100%",background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:6,padding:"7px",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                  <I n="stop" s={12}/> إيقاف وحفظ
                </button>
              ):(
                <button onClick={startRecording} style={{width:"100%",background:"#e06a24",color:"#fff",border:"none",borderRadius:6,padding:"7px",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                  <I n="mic" s={12}/> بدء التسجيل
                </button>
              )}
            </div>
          </>,
          document.body
        )}
      </div>
    );
  }

  return (
    <div style={{position:"relative",display:"inline-block"}}>
      <button ref={btnRef} onClick={()=>{open?setOpen(false):openMenu(200);}} title="تشغيل التعليق الصوتي"
        style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"3px 4px",cursor:"pointer",display:"inline-flex"}}>
        <I n="mic" s={11}/>
      </button>
      {open&&ReactDOM.createPortal(
        <>
          <div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:9998}}/>
          <div ref={popupRef} onClick={e=>e.stopPropagation()} style={{position:"fixed",top:pos.top,left:pos.left,zIndex:9999,background:"#0d1224",border:"1px solid #1e3a5f",borderRadius:8,padding:10,width:200,boxShadow:"0 10px 30px rgba(0,0,0,0.5)"}}>
            <audio ref={audioRef} src={Api.voiceCommentUrl(file.id)} onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)} onEnded={()=>setPlaying(false)} style={{display:"none"}}/>
            <button onClick={togglePlay} style={{width:"100%",background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"7px",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              <I n={playing?"pause":"play"} s={12}/> {playing?"إيقاف مؤقت":"تشغيل"}
            </button>
            {canEdit&&(
              <div style={{display:"flex",gap:5,marginTop:6}}>
                {recording?(
                  <button onClick={stopRecording} style={{flex:1,background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:5,padding:"5px",cursor:"pointer",fontSize:10}}>إيقاف وحفظ</button>
                ):(
                  <button onClick={startRecording} style={{flex:1,background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:5,padding:"5px",cursor:"pointer",fontSize:10}}>إعادة تسجيل</button>
                )}
                <button onClick={remove} disabled={busy} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:5,padding:"5px 8px",cursor:"pointer",fontSize:10}}>حذف</button>
              </div>
            )}
          </div>
        </>,
        document.body
      )}
    </div>
  );
}

/* Paste Target — Singleton عبر كل نسخ AdminTable (كبيرة/صغيرة/قائمة الانتظار):
   كل نسخة من AdminTable مستقلة ولها pasteTargetId خاص بها، وكانت كل نسخة تضيف
   window.addEventListener("paste",...) الخاص بها بشكل مستقل طالما pasteTargetId فيها ليست null.
   المشكلة: لو صار عندنا أكثر من نسخة عندها pasteTargetId فعّال في نفس الوقت (مثلاً بسبب
   التركيز/الـFocus على صف في جدول ثم صف في جدول آخر دون تصفير الأول)، يصبح هناك أكثر من
   Listener فعّال على window في نفس اللحظة، وبالتالي عملية Ctrl+V واحدة تُنفّذ في أكثر من
   نسخة فتُلصق الصورة في أكثر من ملف. هذا المتغير يضمن أنه في أي لحظة توجد نسخة واحدة فقط
   صاحبة الـPaste Target الفعّال؛ عند تفعيل نسخة جديدة، يتم تصفير أي نسخة سابقة أولاً. */
let globalPasteTargetOwner=null;

/* ---- ADMIN TABLE ---- */
function AdminTable({machine,title,onChanged,addToast,onOpenImage,workDayId}){
  const[showAdd,ssa]=useState(false);
  const[fname,sfn]=useState("");const[ftime,sft]=useState("00:00:00");
  const[dragIdx,sdi]=useState(null);
  const[editId,sei]=useState(null);const[editName,sen]=useState("");
  const[editTimeId,setETI]=useState(null);const[editTimeVal,setETV]=useState("");
  const[busy,sBusy]=useState(false);
  const[uploading,sUploading]=useState(false);
  const[thumbUploadingId,setThumbUploadingId]=useState(null);
  const[externalDrag,setExternalDrag]=useState(false);
  const[pasteTargetId,setPasteTargetId]=useState(null);
  /* Multi-Select (Bulk Actions) — state جديد مستقل تمامًا عن pasteTargetId، لا يُقرأ ولا يُعدَّل من نظام Ctrl+V أعلاه ولا يُعدِّله */
  const[selectedFileIds,setSelectedFileIds]=useState([]);
  const fileRef=useRef();
  const thumbRefs=useRef({});
  const dragCounter=useRef(0);
  /* isPastingRef: قفل يمنع تنفيذ أكثر من عملية Upload واحدة في حال حدوث أكثر من Ctrl+V بسرعة */
  const isPastingRef=useRef(false);
  /* دالة ثابتة (نفس المرجع عبر كل الـRenders) تُصفّر pasteTargetId لهذه النسخة تحديدًا — تُستخدم كمعرّف لهذه النسخة داخل globalPasteTargetOwner */
  const clearMyPasteTarget=useCallback(()=>setPasteTargetId(null),[]);
  const run=machine.status==="RUNNING";

  const wrap=async(fn)=>{
    sBusy(true);
    try{ await fn(); }
    catch(e){ addToast(e.message||"حدث خطأ",'error'); }
    finally{ sBusy(false); }
  };

  const addByName=(name)=>wrap(async()=>{
    await Api.addFileByName(machine.code,name,ftime,workDayId);
    await onChanged();
    sfn("");ssa(false);
  });

  const uploadFiles=async(fileList)=>{
    const files=Array.from(fileList||[]);
    if(files.length===0) return;
    sUploading(true);
    try{
      for(const f of files){
        await Api.uploadFile(machine.code,f,"00:00:00",workDayId);
      }
      await onChanged();
      ssa(false);
      addToast(files.length>1?`تم رفع ${files.length} ملفات بنجاح`:"تم رفع الملف بنجاح",'success');
    }catch(err){
      addToast(err.message||"فشل رفع الملف",'error');
    }finally{
      sUploading(false);
    }
  };

  const handleFileInput=async(e)=>{
    await uploadFiles(e.target.files);
    e.target.value="";
  };

  const handleThumbInput=async(f,e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file) return;
    setThumbUploadingId(f.id);
    try{
      await Api.uploadThumbnail(f.id,file,machine.code,title);
      await onChanged();
    }catch(err){
      addToast(err.message||"فشل رفع صورة المعاينة",'error');
    }finally{
      setThumbUploadingId(null);
    }
  };

  const del=(f)=>wrap(async()=>{
    if(!confirm(`هل تريد حذف الملف "${f.name}"؟`)) return;
    await Api.deleteFile(f.id,machine.code,title);
    await onChanged();
  });

  /* Bulk Actions — تعمل فقط على selectedFileIds (مستقل تمامًا عن pasteTargetId) */
  const bulkDelete=()=>wrap(async()=>{
    const n=selectedFileIds.length;
    if(n===0) return;
    if(!confirm(`هل تريد حذف ${n} ملف محدد؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    const result=await Api.bulkDeleteFiles(selectedFileIds,title);
    clearSelection();
    await onChanged();
    if(result && result.skippedIds && result.skippedIds.length>0){
      addToast(`تم حذف ${result.deletedCount} ملف، وتخطي ${result.skippedIds.length} (لم تعد موجودة)`,'success');
    }else{
      addToast(`تم حذف ${n} ملف بنجاح`,'success');
    }
  });

  const bulkMove=(targetMachineCode)=>wrap(async()=>{
    const n=selectedFileIds.length;
    if(n===0||!targetMachineCode) return;
    const result=await Api.bulkMoveFiles(selectedFileIds,targetMachineCode,workDayId);
    clearSelection();
    await onChanged();
    if(result && result.skippedIds && result.skippedIds.length>0){
      addToast(`تم نقل ${result.movedCount} ملف، وتخطي ${result.skippedIds.length}`,'success');
    }else{
      addToast(`تم نقل ${n} ملف بنجاح`,'success');
    }
  });

  const updSt=(f,status)=>wrap(async()=>{
    await Api.setFileStatus(f.id,status,machine.code,title);
    await onChanged();
  });

  const saveEdit=(f)=>wrap(async()=>{
    if(!editName.trim()){ sei(null); return; }
    await Api.renameFile(f.id,editName.trim(),machine.code,title);
    await onChanged();
    sei(null);
  });

  const saveTime=(f)=>wrap(async()=>{
    await Api.setFileTime(f.id,editTimeVal,machine.code,title);
    await onChanged();
    setETI(null);
  });

  const saveComment=async(f,text)=>{
    try{
      await Api.setTextComment(f.id,text,machine.code,title);
      await onChanged();
    }catch(e){
      addToast(e.message||"فشل حفظ التعليق",'error');
    }
  };
  const deleteComment=async(f)=>{
    try{
      await Api.deleteTextComment(f.id,machine.code,title);
      await onChanged();
    }catch(e){
      addToast(e.message||"فشل حذف التعليق",'error');
    }
  };
  const uploadVoice=async(f,blob)=>{
    try{
      await Api.uploadVoiceComment(f.id,blob,machine.code,title);
      await onChanged();
    }catch(e){
      addToast(e.message||"فشل رفع التعليق الصوتي",'error');
    }
  };
  const deleteVoice=async(f)=>{
    try{
      await Api.deleteVoiceComment(f.id,machine.code,title);
      await onChanged();
    }catch(e){
      addToast(e.message||"فشل حذف التعليق الصوتي",'error');
    }
  };

  const download=async(f)=>{
    if(!f.hasFile){ addToast("لا يوجد ملف فعلي للتحميل",'error'); return; }
    try{
      await triggerDownload(Api.downloadFileUrl(f.id), f.originalFilename||f.name);
    }catch(e){
      addToast(e.message||"فشل تحميل الملف",'error');
    }
  };

  const [localFiles,setLocalFiles]=useState(machine.files);
  useEffect(()=>{ setLocalFiles(machine.files); },[machine.files]);

  /* Multi-Select: تنظيف التحديد من أي id لم يعد موجودًا في localFiles (بعد حذف/نقل/تحديث) */
  useEffect(()=>{
    setSelectedFileIds(prev=>{
      const validIds=new Set(localFiles.map(f=>f.id));
      const next=prev.filter(id=>validIds.has(id));
      return next.length===prev.length?prev:next;
    });
  },[localFiles]);

  const isSelected=(id)=>selectedFileIds.includes(id);
  const toggleSelect=(id)=>{
    setSelectedFileIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  };
  const allSelected=localFiles.length>0 && selectedFileIds.length===localFiles.length;
  const someSelected=selectedFileIds.length>0 && !allSelected;
  const toggleSelectAll=()=>{
    setSelectedFileIds(allSelected?[]:localFiles.map(f=>f.id));
  };
  const clearSelection=()=>setSelectedFileIds([]);
  const selectAllRef=useRef(null);
  useEffect(()=>{
    if(selectAllRef.current) selectAllRef.current.indeterminate=someSelected;
  },[someSelected]);

  const onRowDragStart=(e,i,f)=>{
    sdi(i);
    e.dataTransfer.setData("text/plain", JSON.stringify({fileId:f.id, sourceCode:machine.code}));
    e.dataTransfer.effectAllowed="move";
  };
  const onRowDragOverInternal=(e,i)=>{
    e.preventDefault();
    if(dragIdx===null||dragIdx===i) return;
    const arr=[...localFiles]; const[mv]=arr.splice(dragIdx,1); arr.splice(i,0,mv);
    setLocalFiles(arr); sdi(i);
  };
  const onRowDragEnd=()=>wrap(async()=>{
    if(dragIdx===null) return;
    const orderedIds = localFiles.map(f=>f.id);
    sdi(null);
    await Api.reorderFiles(machine.code,orderedIds,workDayId);
    await onChanged();
  });

  const isExternalFileDrag=(e)=> e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files");

  const onContainerDragEnter=(e)=>{
    e.preventDefault();
    if(isExternalFileDrag(e)){
      dragCounter.current++;
      setExternalDrag(true);
    }
  };
  const onContainerDragOver=(e)=>{
    e.preventDefault();
    if(isExternalFileDrag(e)) e.dataTransfer.dropEffect="copy";
    else e.dataTransfer.dropEffect="move";
  };
  const onContainerDragLeave=(e)=>{
    if(isExternalFileDrag(e)){
      dragCounter.current--;
      if(dragCounter.current<=0){ setExternalDrag(false); dragCounter.current=0; }
    }
  };
  const onContainerDrop=async(e)=>{
    e.preventDefault();
    setExternalDrag(false);
    dragCounter.current=0;

    if(e.dataTransfer.files && e.dataTransfer.files.length>0){
      await uploadFiles(e.dataTransfer.files);
      return;
    }

    const raw=e.dataTransfer.getData("text/plain");
    if(!raw) return;
    let payload;
    try{ payload=JSON.parse(raw); }catch(err){ return; }
    if(!payload || !payload.fileId || payload.sourceCode===machine.code) return;

    await wrap(async()=>{
      await Api.moveFile(payload.fileId, machine.code);
      addToast(`تم نقل الملف إلى ${title}`,'success');
      await onChanged();
    });
  };

  useEffect(()=>{
    if(!pasteTargetId) return;
    /* تثبيت الـTarget عند بداية عملية اللصق: targetId ثابت طوال عملية الـUpload
       ولا نعتمد على pasteTargetId (المتغيّر) بعد هذه اللحظة، حتى لو حدث Re-render
       أو تغيّرت الـStates أثناء الرفع. */
    const targetId=pasteTargetId;
    const handler=async(e)=>{
      /* منع Duplicate Paste: تجاهل أي Paste جديد أثناء تنفيذ عملية رفع سابقة */
      if(isPastingRef.current) return;
      const items=e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(const item of items){
        if(item.type && item.type.startsWith("image/")){
          const blob=item.getAsFile();
          if(!blob) continue;
          const f=localFiles.find(x=>x.id===targetId);
          if(!f) return;
          isPastingRef.current=true;
          setThumbUploadingId(targetId);
          try{
            await Api.uploadThumbnail(targetId, blob, machine.code, title);
            await onChanged();
            addToast("تم لصق الصورة كمعاينة بنجاح",'success');
          }catch(err){
            addToast(err.message||"فشل لصق الصورة",'error');
          }finally{
            setThumbUploadingId(null);
            setPasteTargetId(null);
            if(globalPasteTargetOwner===clearMyPasteTarget) globalPasteTargetOwner=null;
            isPastingRef.current=false;
          }
          break;
        }
      }
    };
    window.addEventListener("paste",handler);
    return ()=>window.removeEventListener("paste",handler);
  },[pasteTargetId,localFiles,machine.code,title,addToast,onChanged,clearMyPasteTarget]);

  /* عند إلغاء تركيب هذه النسخة من AdminTable، تأكد من عدم بقاء مرجع معلّق (Stale)
     في globalPasteTargetOwner يشير إلى نسخة لم تعد موجودة */
  useEffect(()=>{
    return ()=>{
      if(globalPasteTargetOwner===clearMyPasteTarget) globalPasteTargetOwner=null;
    };
  },[clearMyPasteTarget]);

  return(
    <div
      onDragEnter={onContainerDragEnter}
      onDragOver={onContainerDragOver}
      onDragLeave={onContainerDragLeave}
      onDrop={onContainerDrop}
      style={{background:"#0d1224",border:"1px solid "+(externalDrag?"#e06a24":"#1e2d4a"),borderRadius:12,overflow:"hidden",flex:1,minWidth:0,position:"relative",transition:"border-color 0.15s"}}>
      {busy&&(
        <div style={{position:"absolute",top:8,left:8,zIndex:5}}><Spinner s={16}/></div>
      )}
      {externalDrag&&(
        <div style={{position:"absolute",inset:0,zIndex:20,background:"rgba(249,115,22,0.12)",backdropFilter:"blur(1px)",display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
          <div style={{background:"#0d1224",border:"2px dashed #e06a24",borderRadius:12,padding:"18px 28px",display:"flex",flexDirection:"column",alignItems:"center",gap:6,color:"#e06a24"}}>
            <I n="ul" s={26}/>
            <span style={{fontSize:13,fontWeight:600}}>أفلت الملف هنا لإضافته إلى {title}</span>
          </div>
        </div>
      )}
      <div style={{padding:"11px 14px",borderBottom:"1px solid #1e2d4a",background:"#0f1830"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:6,flexWrap:"wrap"}}>
          <span style={{fontWeight:700,color:"#e06a24",fontSize:13}}>{title}</span>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {/* 🆕 زر "تسجيل بدء/توقف التشغيل" أُزيل نهائيًا هنا (HANDOFF §5 — Machine ON/OFF
                control غير مطلوب، الموقع لا يتحكم فعليًا بأي ماكينة). كان مؤجَّلاً سابقًا فقط
                لأنه كان المصدر الوحيد لإحصائيات وقت التشغيل؛ بعد فصل Statistics عن
                machine_runtime_logs لتعتمد على File Time (انظر Change Log §29)، لم يعد هناك
                أي تعارض يمنع إزالته. الحالة (قيد التشغيل/متوقفة) تبقى ظاهرة كمعلومة فقط أدناه،
                مجمَّدة على آخر قيمة لها قبل الإزالة. لا علاقة لهذا بـFile Status (يبقى كما هو تمامًا). */}
            <button onClick={()=>ssa(p=>!p)}
              style={{display:"inline-flex",alignItems:"center",gap:4,background:"#1e3a5f",color:"#60a5fa",border:"1px solid #1e40af",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:11,whiteSpace:"nowrap"}}>
              <I n="plus" s={11}/> إضافة
            </button>
          </div>
        </div>
        <div style={{fontSize:11,color:"#64748b",display:"flex",gap:10,flexWrap:"wrap"}}>
          {machine.code!=="queue"&&(
            <span>الحالة: <span style={{color:run?"#4ade80":"#fca5a5",fontWeight:600}}>{run?"قيد التشغيل":"متوقفة"}</span></span>
          )}
          <span>الملف: <span style={{color:"#e2e8f0"}}>{machine.files.length>0?machine.files[0].name:(machine.currentFile||"—")}</span></span>
          <span>الوقت: <span style={{color:"#60a5fa",fontFamily:"monospace"}}>{machine.totalTime}</span></span>
        </div>
        {showAdd&&(
          <div style={{marginTop:10,background:"#0a0e1a",borderRadius:8,padding:12,border:"1px solid #1e2d4a"}}>
            <div style={{fontSize:12,color:"#94a3b8",marginBottom:8,fontWeight:600}}>إضافة ملف جديد</div>
            <div style={{marginBottom:10,padding:"10px 12px",background:"#0d1224",border:"2px dashed #1e3a5f",borderRadius:8,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <I n="clip" s={20}/>
              <span style={{color:"#64748b",fontSize:12}}>اسحب ملفاً من جهازك مباشرة هنا، أو</span>
              <input ref={fileRef} type="file" accept=".dxf,.svg,.ai,.dwg,.pdf,.png,.jpg,.crv3d" multiple style={{display:"none"}} onChange={handleFileInput}/>
              <button onClick={()=>fileRef.current.click()} disabled={uploading}
                style={{background:"#e06a24",color:"#fff",border:"none",borderRadius:6,padding:"7px 18px",cursor:"pointer",fontSize:12,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5}}>
                {uploading?<><Spinner s={13} color="#fff"/> جاري الرفع...</>:<><I n="ul" s={13}/> اختر ملفاً من الجهاز</>}
              </button>
              <div style={{fontSize:10,color:"#475569"}}>DXF • SVG • AI • DWG • PDF • CRV3D</div>
            </div>
            <div style={{fontSize:11,color:"#64748b",textAlign:"center",marginBottom:8}}>— أو أدخل الاسم يدوياً —</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <input value={fname} onChange={e=>sfn(e.target.value)} placeholder="اسم الملف.dxf"
                style={{flex:1,minWidth:120,background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:6,padding:"7px 10px",color:"#e2e8f0",fontSize:12,outline:"none"}}/>
              <input value={ftime} onChange={e=>sft(e.target.value)} placeholder="00:00:00"
                style={{width:86,background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:6,padding:"7px 8px",color:"#e2e8f0",fontSize:12,outline:"none",fontFamily:"monospace",direction:"ltr"}}/>
              <button onClick={()=>fname.trim()&&addByName(fname.trim())}
                style={{background:"#e06a24",color:"#fff",border:"none",borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>إضافة</button>
              <button onClick={()=>ssa(false)}
                style={{background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:12}}>إلغاء</button>
            </div>
          </div>
        )}
        {selectedFileIds.length>0&&(
          <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8,background:"#12203f",border:"1px solid #1e3a5f",borderRadius:8,padding:"7px 10px",flexWrap:"wrap"}}>
            <span style={{color:"#60a5fa",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>{selectedFileIds.length} ملف محدد</span>
            <select disabled={busy} defaultValue=""
              onChange={e=>{ const v=e.target.value; e.target.value=""; if(v) bulkMove(v); }}
              style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:6,color:"#94a3b8",padding:"5px 6px",fontSize:11,cursor:"pointer"}}>
              <option value="" disabled>نقل إلى...</option>
              {Object.keys(MACHINE_LABELS).filter(code=>code!==machine.code).map(code=>(
                <option key={code} value={code}>{MACHINE_LABELS[code]}</option>
              ))}
            </select>
            <button onClick={bulkDelete} disabled={busy}
              style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:11,display:"inline-flex",alignItems:"center",gap:4}}>
              <I n="trash" s={11}/> حذف المحدد
            </button>
            <button onClick={clearSelection} disabled={busy}
              style={{marginInlineStart:"auto",background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:6,padding:"4px 9px",cursor:"pointer",fontSize:11}}>
              إلغاء التحديد
            </button>
          </div>
        )}
      </div>
      <div style={{overflowX:"auto",maxHeight:360,overflowY:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:460}}>
          <thead><tr style={{background:"#0a0e1a",borderBottom:"1px solid #1e2d4a",position:"sticky",top:0,zIndex:1}}>
            <th style={{padding:"7px 8px",textAlign:"center",color:"#64748b",fontWeight:600}}>
              <input ref={selectAllRef} type="checkbox" checked={allSelected} onChange={toggleSelectAll}
                disabled={localFiles.length===0} title="تحديد الكل"
                style={{cursor:localFiles.length===0?"default":"pointer"}}/>
            </th>
            {["","اسم الملف","معاينة","تعليق","صوت","الحالة","الوقت","إجراءات"].map((h,i)=>(
              <th key={i} style={{padding:"7px 8px",textAlign:i===1?"right":"center",color:"#64748b",fontWeight:600}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {localFiles.length===0&&(
              <tr><td colSpan={9} style={{padding:24,textAlign:"center",color:"#334155",fontSize:12}}>
                {machine.code==="queue"?"لا توجد ملفات في قائمة الانتظار — اسحب ملفاً هنا أو اضغط «إضافة»":"لا توجد ملفات بعد"}
              </td></tr>
            )}
            {localFiles.map((f,i)=>(
              <tr key={f.id} className="drag-row trh"
                draggable onDragStart={e=>onRowDragStart(e,i,f)} onDragOver={e=>onRowDragOverInternal(e,i)} onDragEnd={onRowDragEnd}
                tabIndex={0}
                onFocus={()=>{
                  /* اضمن وجود Paste Target فعّال واحد فقط في كل التطبيق:
                     صفّر أي نسخة أخرى من AdminTable كانت تملك Target فعّال قبل تفعيل هذا الصف */
                  if(globalPasteTargetOwner && globalPasteTargetOwner!==clearMyPasteTarget){
                    globalPasteTargetOwner();
                  }
                  globalPasteTargetOwner=clearMyPasteTarget;
                  setPasteTargetId(f.id);
                }}
                title={pasteTargetId===f.id?"جاهز للصق صورة (Ctrl+V)":"اضغط على الصف ثم Ctrl+V للصق صورة معاينة"}
                style={{
                  borderBottom:"1px solid #1a2744",
                  background: dragIdx===i ? "#1a2744" : rowColorByStatus(f.status),
                  borderRight: pasteTargetId===f.id ? "3px solid #e06a24" : "3px solid "+rowBorderByStatus(f.status),
                  outline:"none"
                }}>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  {/* onFocus هنا يمنع وصول حدث الـFocus (عبر الـBubbling) إلى onFocus الخاص بالصف،
                      حتى لا يؤدي الضغط على الـCheckbox (Multi-Select/Bulk Actions) إلى تغيير pasteTargetId */}
                  <input type="checkbox" checked={isSelected(f.id)} onChange={()=>toggleSelect(f.id)}
                    onFocus={e=>e.stopPropagation()}
                    style={{cursor:"pointer"}}/>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center",color:"#475569"}}><I n="dots" s={14}/></td>
                <td style={{padding:"7px 8px",color:"#e2e8f0",maxWidth:130}}>
                  {editId===f.id?(
                    <div style={{display:"flex",gap:3}}>
                      <input value={editName} onChange={e=>sen(e.target.value)} autoFocus
                        onKeyDown={e=>e.key==="Enter"&&saveEdit(f)}
                        style={{flex:1,background:"#0a0e1a",border:"1px solid #e06a24",borderRadius:4,padding:"3px 5px",color:"#e2e8f0",fontSize:11,outline:"none",minWidth:0}}/>
                      <button onClick={()=>saveEdit(f)} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"2px 5px",cursor:"pointer"}}><I n="ok" s={10}/></button>
                      <button onClick={()=>sei(null)} style={{background:"#3f1515",color:"#fca5a5",border:"none",borderRadius:4,padding:"2px 5px",cursor:"pointer"}}><I n="x" s={10}/></button>
                    </div>
                  ):(
                    <div>
                      <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
                      {f.hasFile&&<div style={{color:"#22c55e",fontSize:9}}>📎 مرفوع</div>}
                    </div>
                  )}
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                    <ThumbCell file={f} onOpen={onOpenImage}/>
                    <input ref={el=>thumbRefs.current[f.id]=el} type="file" accept="image/png,image/jpeg,image/webp" style={{display:"none"}} onChange={e=>handleThumbInput(f,e)}/>
                    <button onClick={()=>thumbRefs.current[f.id]?.click()} disabled={thumbUploadingId===f.id} title={f.hasThumbnail?"تغيير الصورة (أو اضغط الصف والصق Ctrl+V)":"إضافة صورة معاينة (أو اضغط الصف والصق Ctrl+V)"}
                      style={{background:"#1e2d4a",color:"#94a3b8",border:"none",borderRadius:4,padding:"4px 5px",cursor:"pointer"}}>
                      {thumbUploadingId===f.id?<Spinner s={10}/>:<I n="ul" s={10}/>}
                    </button>
                  </div>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  <TextCommentCell file={f} canEdit={true} onSave={saveComment} onDelete={deleteComment}/>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  <VoiceCommentCell file={f} canEdit={true} onUpload={uploadVoice} onDelete={deleteVoice}/>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  <select value={f.status} onChange={e=>updSt(f,e.target.value)}
                    style={{background:"#0a0e1a",border:"1px solid #1e2d4a",borderRadius:4,color:"#94a3b8",padding:"3px 3px",fontSize:10,cursor:"pointer",maxWidth:90}}>
                    <option value="WAITING">انتظار</option>
                    <option value="WORKING">جاري</option>
                    <option value="CUTTING">تم القص</option>
                    <option value="DELIVERED">تسليم</option>
                  </select>
                </td>
                <td style={{padding:"7px 8px",textAlign:"center"}} onMouseDown={e=>e.stopPropagation()}>
                  {editTimeId===f.id?(
                    <div style={{display:"flex",gap:2,justifyContent:"center",alignItems:"center"}}>
                      <input value={editTimeVal} onChange={e=>setETV(e.target.value)} autoFocus
                        onKeyDown={e=>e.key==="Enter"&&saveTime(f)}
                        style={{width:72,background:"#0a0e1a",border:"1px solid #e06a24",borderRadius:4,padding:"3px 5px",color:"#e2e8f0",fontSize:10,outline:"none",fontFamily:"monospace",direction:"ltr",textAlign:"center"}}/>
                      <button onClick={()=>saveTime(f)} style={{background:"#0f4c2a",color:"#4ade80",border:"none",borderRadius:4,padding:"2px 4px",cursor:"pointer"}}><I n="ok" s={10}/></button>

/* ---- ADMIN DASH ---- */
function AdminDash({big,small,queue,onChanged,addToast,onOpenImage,workDayId}){
  const[transferring,setTransferring]=useState(false);

  async function handleTransferWaiting(){
    if(!workDayId){ addToast("اختر يومًا أولاً","error"); return; }
    if(!window.confirm("سيتم نقل كل الملفات بحالة «انتظار» من اليوم الحالي (الماكينتين وقائمة الانتظار) إلى اليوم التالي. متابعة؟")) return;
    setTransferring(true);
    try{
      const result=await Api.transferWaiting(workDayId);
      if(result.totalMoved>0) addToast(`تم نقل ${result.totalMoved} ملف/ملفات إلى اليوم التالي`,'success');
      else addToast("لا توجد ملفات بحالة انتظار لنقلها",'info');
      onChanged();
    }catch(e){
      addToast(e.message||"فشل نقل الانتظار",'error');
    }finally{
      setTransferring(false);
    }
  }

  return(
    <div>
      <h2 style={{color:"#e2e8f0",fontSize:18,fontWeight:700,marginBottom:14,marginTop:0}}>لوحة تحكم المشرف</h2>
      <div className="mobile-stack" style={{display:"flex",gap:12,marginBottom:14}}>
        <MCard m={big} label="ماكينة كبيرة - CNC CO2"/>
        <MCard m={small} label="ماكينة صغيرة - CNC CO2"/>
      </div>
      <div className="mobile-stack" style={{display:"flex",gap:12,marginBottom:14}}>
        <AdminTable machine={big} title="الماكينة الكبيرة" onChanged={onChanged} addToast={addToast} onOpenImage={onOpenImage} workDayId={workDayId}/>
        <AdminTable machine={small} title="الماكينة الصغيرة" onChanged={onChanged} addToast={addToast} onOpenImage={onOpenImage} workDayId={workDayId}/>
      </div>
      {queue&&(
        <div style={{marginTop:4}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
            <I n="inbox" s={16}/>
            <span style={{color:"#e06a24",fontWeight:700,fontSize:14}}>قائمة الانتظار</span>
            <span style={{color:"#475569",fontSize:11}}>— مكان مؤقت لرفع الملفات قبل توزيعها؛ اسحب أي ملف من هنا إلى إحدى الماكينتين (غير ظاهرة للمشغّل)</span>
            <button onClick={handleTransferWaiting} disabled={transferring}
              style={{marginRight:"auto",display:"flex",alignItems:"center",gap:6,background:"#0d1224",color:"#e2e8f0",border:"1px solid #1e2d4a",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:transferring?"default":"pointer",opacity:transferring?0.6:1}}>
              {transferring?<Spinner s={12}/>:<I n="rep" s={13}/>}
              نقل الانتظار لليوم التالي
            </button>
          </div>
          <AdminTable machine={queue} title="قائمة الانتظار" onChanged={onChanged} addToast={addToast} onOpenImage={onOpenImage} workDayId={workDayId}/>
        </div>
      )}
    </div>
  );
}

/* ---- USERS PAGE ---- */
function UsersPage({users,currentUser,onChanged,addToast}){
  const isRoot=currentUser?.isRoot;
  const[showAdd,ssa]=useState(false);
  const[form,sf]=useState({name:"",username:"",password:"",role:"operator",adminCode:""});
  const[err,se]=useState("");const[ok,so]=useState("");
  const[busy,sBusy]=useState(false);

  const add=async()=>{
    se("");so("");
    if(!form.name||!form.username||!form.password){se("يرجى ملء جميع الحقول");return;}
    sBusy(true);
    try{
      await Api.addUser(form);
      so("تم الإضافة بنجاح ✓");
      sf({name:"",username:"",password:"",role:"operator",adminCode:""});
      await onChanged();
      setTimeout(()=>{ssa(false);so("");},1200);
    }catch(e){
      se(e.message||"فشلت العملية");
    }finally{
      sBusy(false);
    }
  };

  const del=async(u)=>{
    if(!confirm(`هل تريد حذف المستخدم "${u.name}"؟`)) return;
    try{
      await Api.deleteUser(u.id);
      await onChanged();
    }catch(e){
      addToast(e.message||"فشل الحذف",'error');

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>

        <button onClick={()=>ssa(p=>!p)}
          style={{display:"inline-flex",alignItems:"center",gap:5,background:"#e06a24",color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>

      {!isRoot&&(
        <div style={{background:"#1e3a5f",border:"1px solid #1e40af",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#93c5fd",display:"flex",gap:6,alignItems:"center"}}>
          <I n="shield" s={13}/> ملاحظة: فقط المشرف الرئيسي يمكنه إضافة أو حذف المشرفين.

      )}

      {showAdd&&(
        <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:12,padding:18,marginBottom:16}}>
          <h3 style={{color:"#e06a24",fontSize:14,fontWeight:600,marginTop:0,marginBottom:12}}>مستخدم جديد</h3>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            {[["name","الاسم","text"],["username","اسم المستخدم","text"],["password","كلمة المرور","password"],["adminCode","كود الأدمن","password"]].map(([k,l,t])=>(
              <div key={k}>
                <label style={{display:"block",fontSize:11,color:"#94a3b8",marginBottom:4}}>{l}</label>

            <label style={{display:"block",fontSize:11,color:"#94a3b8",marginBottom:4}}>النوع</label>
            <select value={form.role} onChange={e=>sf(p=>({...p,role:e.target.value}))}

                <td style={{padding:"10px 12px",textAlign:"center"}}>
                  <OnlineDot online={u.online}/>

                <td style={{padding:"10px 12px",color:"#94a3b8",direction:"ltr",textAlign:"right"}}>{u.username}</td>
                <td style={{padding:"10px 12px",textAlign:"center"}}>
                  <span style={{background:u.role==="admin"?"#7c2d12":"#1e3a5f",color:u.role==="admin"?"#e06a24":"#60a5fa",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:600}}>
                    {u.role==="admin"?"مشرف":"مشغل"}

                </td>

                  <span style={{fontSize:10,color:u.isRoot?"#c2483d":u.role==="admin"?"#e06a24":"#64748b"}}>

/* ---- NOTIFICATIONS PAGE (صفحة كاملة: فلترة حسب النوع + صفحات) ---- */
function NotificationsPage({addToast,onMarkAllRead}){
  const[activeType,setActiveType]=useState(null); // null = الكل
  const[items,setItems]=useState([]);
  const[total,sTotal]=useState(0);
  const[pageNum,setPageNum]=useState(1);
  const[loading,setLoading]=useState(false);
  const limit=20;
  const totalPages=Math.max(1,Math.ceil(total/limit));

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const res=await Api.getAllNotifications({type:activeType||undefined,page:pageNum,limit});
      setItems(res.items||[]);
      sTotal(res.total||0);
    }catch(e){
      addToast(e.message||"فشل تحميل الإشعارات",'error');
    }finally{
      setLoading(false);
    }
  },[activeType,pageNum,addToast]);

  useEffect(()=>{ load(); },[load]);

  const selectType=(t)=>{ setActiveType(t); setPageNum(1); };

  const markAllRead=async()=>{
    if(onMarkAllRead) await onMarkAllRead();
    await load();
  };

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <h2 style={{color:"#e2e8f0",fontSize:18,fontWeight:700,margin:0}}>الإشعارات</h2>
        <button onClick={markAllRead} style={{background:"#1e2d4a",color:"#e06a24",border:"none",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>تحديد الكل كمقروء</button>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <button onClick={()=>selectType(null)}
          style={{background:activeType===null?"#e06a24":"#0d1224",color:activeType===null?"#fff":"#94a3b8",border:"1px solid "+(activeType===null?"#e06a24":"#1e2d4a"),borderRadius:20,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          الكل
        </button>
        {NOTIF_TYPES.map(t=>{
          const tc=NOTIF_TYPE_CONFIG[t];
          const active=activeType===t;
          return(
            <button key={t} onClick={()=>selectType(t)}
              style={{display:"flex",alignItems:"center",gap:5,background:active?tc.color:"#0d1224",color:active?"#fff":tc.color,border:"1px solid "+(active?tc.color:"#1e2d4a"),borderRadius:20,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>
              <I n={tc.icon} s={12}/> {tc.label}
            </button>
          );
        })}
      </div>

      <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:12,overflow:"hidden"}}>
        <div style={{padding:"11px 14px",borderBottom:"1px solid #1e2d4a",background:"#0f1830",display:"flex",justifyContent:"space-between"}}>
          <span style={{color:"#e06a24",fontWeight:600,fontSize:13}}>{activeType?NOTIF_TYPE_CONFIG[activeType].label:"كل الإشعارات"}</span>
          <span style={{color:"#64748b",fontSize:11}}>{total} إشعار</span>
        </div>
        <div style={{minHeight:120}}>
          {loading&&<div style={{padding:24,textAlign:"center",color:"#475569",fontSize:13}}>جاري التحميل...</div>}
          {!loading&&items.length===0&&(
            <div style={{padding:24,textAlign:"center",color:"#475569",fontSize:13}}>لا توجد إشعارات</div>
          )}
          {!loading&&items.map(n=>{
            const tc=NOTIF_TYPE_CONFIG[n.type]||NOTIF_TYPE_CONFIG.file;
            return(
              <div key={n.id} style={{display:"flex",gap:10,padding:"10px 14px",borderBottom:"1px solid #1a2744",alignItems:"flex-start",background:n.is_read?"transparent":"#12203f"}}>
                <div style={{background:tc.bg,color:tc.color,borderRadius:6,padding:"3px 5px",flexShrink:0}}><I n={tc.icon} s={12}/></div>
                <div style={{flex:1,color:"#e2e8f0",fontSize:12}}>{n.message}</div>
                <div style={{color:"#475569",fontSize:11,fontFamily:"monospace",flexShrink:0}}>{fmtLogTime(n.created_at)}</div>
              </div>
            );
          })}
        </div>
      </div>

      {totalPages>1&&(
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:10,marginTop:12}}>
          <button onClick={()=>setPageNum(p=>Math.max(1,p-1))} disabled={pageNum<=1||loading}
            style={{background:"#1e2d4a",color:pageNum<=1?"#475569":"#e2e8f0",border:"none",borderRadius:6,padding:"6px 12px",cursor:pageNum<=1?"default":"pointer",fontSize:12}}>
            السابق
          </button>
          <span style={{color:"#94a3b8",fontSize:12}}>صفحة {pageNum} من {totalPages}</span>
          <button onClick={()=>setPageNum(p=>Math.min(totalPages,p+1))} disabled={pageNum>=totalPages||loading}
            style={{background:"#1e2d4a",color:pageNum>=totalPages?"#475569":"#e2e8f0",border:"none",borderRadius:6,padding:"6px 12px",cursor:pageNum>=totalPages?"default":"pointer",fontSize:12}}>
            التالي
          </button>
        </div>
      )}
    </div>
  );
}

/* ---- STATISTICS PAGE (أسبوعية/شهرية — وقت تشغيل الماكينات الفعلي + جلسات المشغّلين) ---- */
function StatBar({label,seconds,maxSeconds,color,onDelete,deleting}){
  const pct=maxSeconds>0?Math.max(2,Math.round((seconds/maxSeconds)*100)):0;
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
      <div style={{width:70,fontSize:11,color:"#94a3b8",flexShrink:0,textAlign:"left"}}>{label}</div>
      <div style={{flex:1,background:"#0d1224",borderRadius:4,height:14,overflow:"hidden"}}>
        <div style={{width:pct+"%",height:"100%",background:color,borderRadius:4,transition:"width .3s"}}/>
      </div>
      <div style={{width:60,fontSize:10,color:"#64748b",flexShrink:0,fontFamily:"monospace"}}>{secondsToClock(seconds)}</div>
      {onDelete&&seconds>0&&(
        <button onClick={onDelete} disabled={deleting} title="حذف إحصائيات هذا اليوم لهذه الماكينة"

function secondsToClock(s){
  s=Math.max(0,Math.floor(s||0));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h+"س "+String(m).padStart(2,"0")+"د";
}

// أقرب جمعة <= اليوم الحالي، بصيغة "YYYY-MM-DD" (نفس منطق الخادم resolveWeekStart)
function currentWeekStart(){
  const base=new Date();
  const day=base.getDay(); // 0=Sun..6=Sat, الجمعة=5
  const diff=(day-5+7)%7;
  const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()-diff);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function shiftDateStr(dateStr,days){
  const[y,m,d]=dateStr.split("-").map(Number);
  const dt=new Date(y,m-1,d+days);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function ddmmyyyy(dateStr){
  const[y,m,d]=dateStr.split("-");
  return `${d}-${m}-${y}`;
}
// تاريخ اليوم الحالي بصيغة YYYY-MM-DD — يُستخدَم في بادچ التاريخ التلقائي بالشريط العلوي
function todayDateStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// 🆕 خطاف بسيط لبناء/تحديث رسم Chart.js داخل canvas مع تنظيف تلقائي عند إلغاء التركيب
function useChartCanvas(buildConfig, deps){
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  useEffect(()=>{
    if(!canvasRef.current || typeof Chart==="undefined") return;
    if(chartRef.current){ chartRef.current.destroy(); chartRef.current=null; }
    chartRef.current=new Chart(canvasRef.current.getContext("2d"), buildConfig());
    return ()=>{ if(chartRef.current){ chartRef.current.destroy(); chartRef.current=null; } };
    // eslint-disable-next-line
  },deps);
  return canvasRef;
}

// 🆕 خط أفقي متقطّع لهدف ثابت (ساعات)، مرسوم يدويًا بدون أي مكتبة إضافية
// (Chart.js الأساسي لا يدعم خطوط Annotation جاهزة).
function makeTargetLinePlugin(targetHours,label){
  return {
    id:"targetLine",
    afterDraw(chart){
      const {ctx,chartArea,scales}=chart;
      if(!chartArea||!scales.y) return;
      const y=scales.y.getPixelForValue(targetHours);
      if(y<chartArea.top||y>chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle="#eab308";
      ctx.setLineDash([6,4]);
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(chartArea.left,y);
      ctx.lineTo(chartArea.right,y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="#eab308";
      ctx.font="10px sans-serif";
      ctx.textAlign="left";
      ctx.fillText(label,chartArea.left+4,y-4);
      ctx.restore();
    }
  };
}

  const[oStats,setOStats]=useState(null);
  const[sessions,setSessions]=useState([]);
  const[loading,setLoading]=useState(false);

    Api.getUsers().then(us=>setOperators((us||[]).filter(u=>u.role==="operator"))).catch(()=>{});
  },[]);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const base=scope==="week"?{scope,weekStart}:{scope,year,month};

  // + تأكيد نصّي قبل التنفيذ لأنه Destructive ولا يمكن التراجع عنه.
  const handleDeleteDay=useCallback(async(date,code,label)=>{
    const ok=window.confirm(`هل أنت متأكد من حذف إحصائيات "${label}" ليوم ${date}؟\nهذا الإجراء يصفّر وقت الملفات المسجَّلة في هذا اليوم لهذه الماكينة ولا يمكن التراجع عنه.`);

      load();

      addToast(e.message||"فشل حذف الإحصائيات",'error');

      setDeletingKey(null);
    }
  },[addToast,load]);

  // 🆕 HANDOFF §13: Auto-Update عبر Socket.io الحالي (بدون إعادة بناء Socket.io — نفس الاتصال المُمرَّر من App).
  // "machine:update" يُبَث أصلاً عند أي تغيير في ملفات الماكينات (بما فيها إدخال/تعديل File Time عبر
  // PATCH /files/:fileId/time، الذي يغذي الإحصائيات مباشرة) وعند الحذف الفردي/الجماعي/Cleanup.
  // نعيد تحميل الإحصائيات تلقائياً عند وصول أي حدث كهذا وصفحة الإحصائيات مفتوحة، مع Debounce بسيط
  // لتفادي تكرار الطلب عند وصول عدة أحداث متتالية سريعة (مثلاً Cleanup لعدة ملفات دفعة واحدة).
  useEffect(()=>{
    if(!socket) return;
    let debounceTimer=null;
    const scheduleReload=()=>{
      if(debounceTimer) clearTimeout(debounceTimer);
      debounceTimer=setTimeout(()=>{ load(); },800);
    };
    socket.on("machine:update",scheduleReload);
    return ()=>{
      if(debounceTimer) clearTimeout(debounceTimer);
      socket.off("machine:update",scheduleReload);
    };

  const maxDaily=mStats?Math.max(1,...mStats.daily.map(d=>Math.max(d.big||0,d.small||0))):1;

            <div>
              <div style={{color:"#64748b",fontSize:11,marginBottom:8}}>توزيع الأيام</div>
              {mStats.daily.map(d=>(
                <div key={d.date} style={{marginBottom:8}}>
                  <div style={{fontSize:10,color:"#64748b",marginBottom:2,fontFamily:"monospace"}}>{d.date}</div>
                  <StatBar label="كبيرة" seconds={d.big||0} maxSeconds={maxDaily} color="#e06a24"

                  <StatBar label="صغيرة" seconds={d.small||0} maxSeconds={maxDaily} color="#60a5fa"
                    onDelete={()=>handleDeleteDay(d.date,"small",labelByCode.small||"الماكينة الصغيرة")}
                    deleting={deletingKey===d.date+":small"}/>

            </div>
          ):(
            <div style={{color:"#475569",fontSize:12,textAlign:"center",padding:10}}>لا توجد تشغيلات مسجَّلة في هذه الفترة</div>
          )}
        </div>
      )}

      {!loading&&oStats&&(
        <div style={{background:"#0d1224",border:"1px solid #1e2d4a",borderRadius:12,overflow:"hidden"}}>
          <div style={{padding:"11px 14px",borderBottom:"1px solid #1e2d4a",background:"#0f1830",color:"#e06a24",fontWeight:600,fontSize:13}}>
            جلسات المشغّلين (حضور/انصراف)
          </div>
          {oStats.operators.length===0&&(
            <div style={{padding:20,textAlign:"center",color:"#475569",fontSize:12}}>لا يوجد مشغّلون</div>
          )}
          {oStats.operators.map(o=>(
            <div key={o.userId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderBottom:"1px solid #1a2744"}}>
              <div style={{color:"#e2e8f0",fontSize:12}}>{o.name}</div>
              <div style={{display:"flex",gap:12,alignItems:"center"}}>
                {o.openSessions>0&&(
                  <span title="جلسات لم تُغلَق صراحةً (مستبعدة من الإجمالي)" style={{color:"#eab308",fontSize:10,background:"#3a2f0d",padding:"2px 6px",borderRadius:4}}>
                    +{o.openSessions} جلسة مفتوحة

                <span style={{color:"#e2e8f0",fontSize:13,fontFamily:"monospace",fontWeight:600}}>{o.total}</span>
              </div>
            </div>
