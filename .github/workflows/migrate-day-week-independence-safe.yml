name: ترقية قاعدة البيانات (استقلال الأيام والأسابيع — نسخة آمنة)

# 🆕 نسخة مصحّحة من migrate-day-week-independence.yml — تعمل مع الحالة الفعلية
# لقاعدة البيانات الحية (راجع HANDOFF.md §31 لتفاصيل الفحص والسبب).
# استخدم هذا الـWorkflow بدل القديم (الأصلي سيستمر بالفشل لأنه غير متوافق
# مع الحالة الحالية الفعلية لقاعدة البيانات).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب كلمة yes للتأكيد أنك تريد تشغيل هذه الترقية الآن'
        required: true
        default: 'no'

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: تثبيت عميل MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: تشغيل ملف الترقية (الآمن)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" \
                --ssl-mode=REQUIRED "$DB_NAME" < migration_day_week_independence_safe.sql
          echo "✓ تمت الترقية بنجاح"

      - name: التحقق من الجداول والأعمدة الجديدة
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" \
                --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT COUNT(*) AS weeks_count FROM work_weeks; SELECT COUNT(*) AS days_count FROM work_days; SELECT id, day_name, week_id FROM work_days ORDER BY week_id, FIELD(day_name,'fri','sat','sun','mon','tue','wed','thu');"
