name: ترقية قاعدة البيانات (استقلال الأيام والأسابيع)

# استخدم هذا فقط إذا كانت قاعدة بياناتك منشأة مسبقاً بالفعل
# يحوّل work_weeks/work_days إلى شبكة ثابتة 28 خانة (4 أسابيع × 7 أيام) مستقلة تماماً، مع Seed تلقائي
# ⚠️ هذه هي الترقية الأساسية التي تُبنى عليها كل ميزات Phase 31 (نقل الانتظار، Week1-4، Cleanup، الإحصائيات)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب كلمة yes للتأكيد أنك تريد تشغيل هذه الترقية الآن'
        required: true
        default: 'no'

jobs:
  migrate-database:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: تثبيت عميل MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: تشغيل ملف الترقية
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" \
                --ssl-mode=REQUIRED "$DB_NAME" < migration_day_week_independence.sql
          echo "✓ تمت الترقية بنجاح"

      - name: التحقق من الجداول والأعمدة الجديدة
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mysql --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" \
                --ssl-mode=REQUIRED "$DB_NAME" -e "SELECT COUNT(*) AS weeks_count FROM work_weeks; SELECT COUNT(*) AS days_count FROM work_days; DESCRIBE machine_files;"
